apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-api
    spec:
      serviceAccountName: atlas-api
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: registry.example.com/atlas/atlas-api:1.0.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ports:
            - name: https
              containerPort: 8443
          envFrom:
            - configMapRef:
                name: atlas-env
          env:
            - name: ATLAS_PASSWORD_PEPPER_FILE
              value: /run/secrets/atlas-peppers/password_pepper
          readinessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: peppers
              mountPath: /run/secrets/atlas-peppers
              readOnly: true
      volumes:
        - name: peppers
          secret:
            secretName: atlas-peppers
            defaultMode: 0440
