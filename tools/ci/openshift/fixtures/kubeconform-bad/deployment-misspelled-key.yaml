# kubeconform must refuse this: `replica` is not a field of a Deployment (strict mode).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
spec:
  replica: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas-api
    spec:
      containers:
        - name: api
          image: registry.example.com/atlas/atlas-api:1.0.0
