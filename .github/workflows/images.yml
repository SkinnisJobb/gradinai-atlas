# The OSS install's images (STORY-oss-18, OSS-26 E): build, check, scan, and publish on a release tag.
#
# WHAT. Every image deploy/oss/docker-compose.yml BUILDS, from the same recipe it builds:
#
#   atlas-api       backend/Dockerfile --target hardened   atlas-api, atlas-migrate, atlas-retrieval
#   atlas-mcp       mcp/Dockerfile --target hardened       atlas-mcp
#   atlas-backup    backend/Dockerfile --target backup     atlas-backup (profile backup)
#   atlas-postgres  deploy/postgres/pgvector.Dockerfile    atlas-postgres
#   atlas-tls       deploy/caddy/Dockerfile                atlas-tls (Caddy + the Cloudflare DNS plugin)
#
# and the OpenShift images on Red Hat UBI 9 (docs/oss/research/openshift-aro.md, Story 1), which
# the compose install does not use; published since TASK-1483 (v0.0.2-alpha):
#
#   atlas-api-ubi   backend/Dockerfile --target hardened-ubi   (TASK-1476)
#   atlas-mcp-ubi   mcp/Dockerfile --target hardened-ubi       (TASK-1477; + build context `repo`)
#   atlas-tls-ubi   deploy/caddy/Dockerfile.ubi                (TASK-1478; stock Caddy, no plugin;
#                                                               + build context `repo`)
#
# The two `repo` builds are handed the repository root as the named build context `repo`, for
# the LICENSE and NOTICE their /licenses carries (their own contexts are mcp/ and deploy/caddy/).
#
# The one image the OSS compose PULLS, the gateway profile's AgentGateway, is upstream and pinned
# tag@digest in the compose file; it is not republished (docs/oss/RELEASES.md, "What a release
# publishes"). The hardened api/mcp/backup images are non-root, UID-agnostic, with a HEALTHCHECK;
# the default stage the homelab builds is not touched by this workflow.
#
#   build-scan  every PR touching the images' inputs, every v* tag, by hand: build all eight,
#               check the image config of api, mcp and backup (numeric non-root USER,
#               HEALTHCHECK, starts a process under an arbitrary UID in group 0; Postgres and
#               Caddy run as their upstream images do, outside OSS-18's scope), then Trivy and
#               THE SAME GATE as sbom-sca.yml (tools/ci/sca_gate.py + tools/ci/sca-accepted.json:
#               a fixable CRITICAL or HIGH fails, an accepted one warns until its date, one with
#               no fix is reported). The dependencies are the hashed locks (--require-hashes).
#               The three -ubi images also go through Red Hat's `preflight check container`
#               (pinned by version and sha256, no Red Hat account, against a throwaway local
#               registry): see that step for which of its checks block and why.
#   publish     v* tags only (the tag push, or `gh workflow run images.yml --ref <tag>` to run it
#               again), after build-scan passed. First the release check: the tag is
#               semver (vMAJOR.MINOR.PATCH, optionally -prerelease) and docs/oss/RELEASES.md has a
#               `## <tag>` section. Then push all eight to ghcr.io/<owner>/gradinai-atlas-<name>
#               (the five, plus api-ubi, mcp-ubi and tls-ubi), tagged with the git tag, and write
#               each `name:tag@digest` (job summary, outputs, and `release-images.env`: the five
#               lines an install pastes into .env for deploy/oss/release.yml, then the three
#               ATLAS_IMAGE_*_UBI lines an OpenShift overlay takes its digests from, which
#               compose reads nothing of). The only job with `packages: write`. The push rebuilds
#               from build-scan's layer cache (type=gha, same scope), so it pushes the layers
#               that were scanned.
#   release     after publish: a DRAFT GitHub release for the tag, its notes the tag's section
#               of docs/oss/RELEASES.md plus the eight references, `release-images.env` attached.
#               A -prerelease tag makes a prerelease. Re-running updates the notes and replaces
#               the asset. The only job with `contents: write`. A draft, because a release made
#               with the job's own token triggers no workflow: a maintainer publishes it
#               (`gh release edit <tag> --draft=false`), and that `release: published` event is
#               what makes sbom-sca.yml attach the SBOMs. It is also the last look before the
#               release is public.
#
# HOW A RELEASE IS CUT: docs/oss/RELEASES.md, "Cutting a release" (a maintainer pushes the tag;
# nothing here creates one).
#
# MINUTES. One build job; layers from the GitHub Actions cache, the Trivy binary and DB from
# actions/cache. Actions are pinned to commit SHAs (tools/ci/check_pins.py).

name: images

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master]
    # Path filter on pull requests only: what goes into either image, and this gate.
    paths:
      - "backend/**"
      - "mcp/**"
      - "frontend/**"
      - "deploy/postgres/**"
      - "deploy/caddy/**"
      - "deploy/openshift/base/caddy/**"
      - "LICENSE"
      - "NOTICE"
      - "docs/oss/RELEASES.md"
      - "tools/ci/sca_gate.py"
      - "tools/ci/sca-accepted.json"
      - ".github/workflows/images.yml"
  workflow_dispatch:

# ONE RUN PER CHANGE, as in the other workflows: a PR's superseded runs are cancelled; tags and
# manual runs are grouped by commit SHA and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.ref_type }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The same Trivy as sbom-sca.yml (keep the two in step).
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
  TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db
  TRIVY_NO_PROGRESS: "true"
  TRIVY_DISABLE_VEX_NOTICE: "true"
  # Red Hat's preflight (github.com/redhat-openshift-ecosystem/openshift-preflight), the release
  # binary checked against this sha256 (the release's own asset digest). No Red Hat account: the
  # checks run locally and nothing is submitted.
  PREFLIGHT_VERSION: 1.21.2
  PREFLIGHT_SHA256: 7e33916cafb2633afe81ef2beb62d2bb53b441f1dd794c7e8578ce22dcc1948b
  # The throwaway registry preflight pulls the -ubi images from (it reads a registry, not the
  # docker daemon), tag@digest like every image (tools/ci/check_pins.py).
  PREFLIGHT_REGISTRY_IMAGE: registry:3.0.0@sha256:6c5666b861f3505b116bb9aa9b25175e71210414bd010d92035ff64018f9457e

jobs:
  build-scan:
    name: build, check and scan the OSS images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: prepare
        id: prep
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/sca"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: cache trivy
        id: trivy-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin/trivy
          key: trivy-bin-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_SHA256 }}

      - name: download trivy (checksum verified)
        if: steps.trivy-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO --retry 3 "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$f"
          echo "$TRIVY_SHA256  $f" | sha256sum -c -
          tar -xzf "$f" -C bin trivy

      - name: cache the trivy DB
        id: trivy-db
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy/db
          key: trivy-db-${{ steps.prep.outputs.day }}
          restore-keys: trivy-db-

      - name: trivy DB
        run: |
          set -euo pipefail
          trivy --version
          if [ "${{ steps.trivy-db.outputs.cache-hit }}" = "true" ]; then
            echo "TRIVY_SKIP_DB_UPDATE=true" >> "$GITHUB_ENV"; echo "DB from today's cache"
          else
            trivy image --download-db-only --quiet
          fi

      # On the self-hosted runner (CI_RUNNER set) buildx builds in the runner's own docker: no
      # BuildKit container per job, no second copy of every layer through `load`, and the layers the
      # last run built are reused. The GitHub Actions cache needs the docker-container driver, so it
      # is used only on GitHub's runners. operations.md on atlas-ci-runner, "Builds".
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ vars.CI_RUNNER && 'docker' || 'docker-container' }}

      - name: build atlas-api (hardened)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: hardened
          tags: atlas-api:hardened
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-api-hardened' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-api-hardened' || '' }}

      - name: build atlas-mcp (hardened)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp
          target: hardened
          tags: atlas-mcp:hardened
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-mcp-hardened' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-mcp-hardened' || '' }}

      # The `backup` stage is `hardened` plus the Postgres client: the api layers come from the
      # build above (the same builder), only its own stage is new.
      - name: build atlas-backup (backup stage)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: backup
          tags: atlas-backup:release
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-backup' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-backup' || '' }}

      # OpenShift's API image (TASK-1476): `hardened` on ubi9/python-312-minimal. Opt-in, built here
      # only; its `base` layers are the ones the hardened build above just made. The two build
      # args are its `version` and `release` labels (TASK-1483), set as publish sets them; they
      # come after the stage's last RUN, so they change no layer.
      - name: build atlas-api (hardened-ubi)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: hardened-ubi
          build-args: |
            ATLAS_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
            ATLAS_RELEASE=${{ github.sha }}
          tags: atlas-api:hardened-ubi
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-api-hardened-ubi' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-api-hardened-ubi' || '' }}

      # OpenShift's MCP image (TASK-1477): `hardened` on ubi9/python-312-minimal, as the API's.
      - name: build atlas-mcp (hardened-ubi)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp
          target: hardened-ubi
          build-contexts: repo=.
          build-args: |
            ATLAS_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
            ATLAS_RELEASE=${{ github.sha }}
          tags: atlas-mcp:hardened-ubi
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-mcp-hardened-ubi' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-mcp-hardened-ubi' || '' }}

      - name: build atlas-postgres (deploy/postgres/pgvector.Dockerfile)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          file: deploy/postgres/pgvector.Dockerfile
          tags: atlas-postgres:release
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-postgres-release' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-postgres-release' || '' }}

      - name: build atlas-tls (deploy/caddy)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          tags: atlas-tls:release
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-tls-release' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-tls-release' || '' }}

      # OpenShift's Caddy front (TASK-1478): xcaddy on ubi9/go-toolset, the static binary on
      # ubi9/ubi-micro. deploy/caddy/Dockerfile above is unchanged.
      - name: build atlas-tls (deploy/caddy/Dockerfile.ubi)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          file: deploy/caddy/Dockerfile.ubi
          build-contexts: repo=.
          build-args: |
            ATLAS_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
            ATLAS_RELEASE=${{ github.sha }}
          tags: atlas-tls:ubi
          load: true
          cache-from: ${{ !vars.CI_RUNNER && 'type=gha,scope=atlas-tls-ubi' || '' }}
          cache-to: ${{ !vars.CI_RUNNER && 'type=gha,mode=max,scope=atlas-tls-ubi' || '' }}

      # Acceptance 1 and 2 on the image itself. The full stack under an arbitrary UID is the
      # install smoke's leg 1 (install-smoke.yml).
      - name: "check: non-root numeric USER, HEALTHCHECK, runs under an arbitrary UID"
        run: |
          set -euo pipefail
          bad=0
          for img in atlas-api:hardened atlas-mcp:hardened atlas-backup:release atlas-api:hardened-ubi atlas-mcp:hardened-ubi; do
            user=$(docker image inspect -f '{{.Config.User}}' "$img")
            hc=$(docker image inspect -f '{{if .Config.Healthcheck}}{{join .Config.Healthcheck.Test " "}}{{end}}' "$img")
            echo "$img: USER=$user"
            echo "$img: HEALTHCHECK=$hc"
            [[ "$user" =~ ^[1-9][0-9]*:0$ ]] || { echo "::error::$img: USER is not a numeric non-root UID in group 0"; bad=1; }
            [ -n "$hc" ] || { echo "::error::$img: no HEALTHCHECK"; bad=1; }
            # A UID the image has never heard of: reads its code, writes HOME and /tmp, not /app.
            out=$(docker run --rm --user 1000770000:0 --entrypoint sh "$img" -c \
              'id -u; cat /app/Dockerfile.build >/dev/null && echo readable; touch "$HOME/.probe" /tmp/.probe && echo writable; if touch /app/.probe 2>/dev/null; then echo app-writable; else echo app-readonly; fi')
            echo "$out" | sed "s|^|$img: |"
            [ "$(echo "$out" | sed -n 1p)" = 1000770000 ] || bad=1
            # Here-strings, never `echo | grep -q` under pipefail: grep -q exits at its first match,
            # the writer can die of SIGPIPE, and the pipeline's status turns the match into a miss
            # (TASK-1504).
            grep -qx readable <<< "$out" || { echo "::error::$img: an arbitrary UID cannot read /app"; bad=1; }
            grep -qx writable <<< "$out" || { echo "::error::$img: an arbitrary UID cannot write HOME or /tmp"; bad=1; }
            grep -qx app-readonly <<< "$out" || { echo "::error::$img: /app is writable at run time"; bad=1; }
          done
          [ "$bad" = 0 ]

      # The OpenShift contract for the -ubi images (TASK-1476): restricted SCC runs them under an
      # arbitrary UID in group 0 and the ARO manifests set readOnlyRootFilesystem, so each is started
      # exactly that way: `--user 1000770000:0 --read-only`, with only /tmp as a tmpfs (an emptyDir
      # there). atlas-api: `atlas-migrate --help` (the migration Job's entrypoint) and uvicorn up to
      # a 200 from /healthz against a throwaway atlas-postgres (the image built above), with
      # throwaway peppers; nothing here is a secret and the network is removed afterwards.
      # atlas-mcp (TASK-1477): `python -m uvicorn app.main:app` (the image's CMD) up to a 200 from
      # /health; it needs ATLAS_BASE_URL set to start, and dials it only when a tool is called.
      - name: "check: the -ubi images start under 1000770000:0 with a read-only root filesystem"
        run: |
          set -euo pipefail
          run_ro() { docker run --user 1000770000:0 --read-only --tmpfs /tmp "$@"; }
          rand() { python3 -c 'import base64, os; print(base64.b64encode(os.urandom(32)).decode())'; }
          probe() { # <container> <port> <path> [Host]: a 200 from inside the container, by its python
            docker exec "$1" python -c "import sys, urllib.request as u; r = u.urlopen(u.Request('http://127.0.0.1:$2$3', headers={'Host': '${4:-localhost}'}), timeout=4); sys.exit(r.status != 200)"
          }
          wait_up() { # <container> <port> <path> [Host]
            for _ in $(seq 1 60); do
              [ "$(docker inspect -f '{{.State.Running}}' "$1")" = true ] || { docker logs "$1" || true; return 1; }
              probe "$@" 2>/dev/null && return 0
              sleep 1
            done
            docker logs "$1" || true; return 1
          }
          docker network create ubi-probe >/dev/null
          trap 'docker rm -f ubi-api ubi-mcp ubi-pg >/dev/null 2>&1 || true; docker network rm ubi-probe >/dev/null 2>&1 || true' EXIT

          # atlas-api:hardened-ubi
          run_ro --rm atlas-api:hardened-ubi atlas-migrate --help >/dev/null             || { echo "::error::atlas-api:hardened-ubi: atlas-migrate --help failed under 1000770000:0, read-only"; exit 1; }
          echo "atlas-api:hardened-ubi: atlas-migrate --help ok"
          pgpw=$(rand | tr -dc 'A-Za-z0-9')
          docker run -d --name ubi-pg --network ubi-probe -e POSTGRES_USER=atlas -e POSTGRES_DB=atlas             -e POSTGRES_PASSWORD="$pgpw" atlas-postgres:release >/dev/null
          for _ in $(seq 1 60); do docker exec ubi-pg pg_isready -U atlas -d atlas -h 127.0.0.1 >/dev/null 2>&1 && break; sleep 1; done
          env_file="$RUNNER_TEMP/ubi-api.env"
          {
            echo "ATLAS_DB_URL=postgresql+psycopg2://atlas:$pgpw@ubi-pg:5432/atlas"
            echo "ATLAS_PASSWORD_PEPPER=$(rand)"
            echo "ATLAS_TOKEN_PEPPER=$(rand)"
            echo "ATLAS_PUBLIC_URL=https://atlas.example.com"
          } > "$env_file"
          run_ro -d --name ubi-api --network ubi-probe --env-file "$env_file" atlas-api:hardened-ubi >/dev/null
          wait_up ubi-api 8000 /healthz atlas.example.com             || { echo "::error::atlas-api:hardened-ubi: uvicorn did not answer /healthz under 1000770000:0, read-only"; exit 1; }
          echo "atlas-api:hardened-ubi: uvicorn up, /healthz 200 (uid $(docker exec ubi-api id -u), read-only root)"
          rm -f "$env_file"

          # atlas-mcp:hardened-ubi
          run_ro -d --name ubi-mcp -e ATLAS_BASE_URL=https://atlas.example.com atlas-mcp:hardened-ubi             python -m uvicorn app.main:app --host 0.0.0.0 --port 8092 >/dev/null
          wait_up ubi-mcp 8092 /health             || { echo "::error::atlas-mcp:hardened-ubi: uvicorn did not answer /health under 1000770000:0, read-only"; exit 1; }
          echo "atlas-mcp:hardened-ubi: uvicorn up, /health 200 (uid $(docker exec ubi-mcp id -u), read-only root)"

      # atlas-tls:ubi (TASK-1478) running THE OPENSHIFT CADDYFILE (deploy/openshift/base/caddy/,
      # TASK-1490) as deploy/openshift/base/deployment-tls.yaml runs it: under an arbitrary UID with
      # a read-only root, XDG_CONFIG_HOME / XDG_DATA_HOME on a tmpfs each (the emptyDirs), the
      # ConfigMap's files at /etc/caddy, a service-CA-shaped CA and leaves (throwaway, made here)
      # at the Secret and ConfigMap paths, and the Deployment's environment. The upstreams are a
      # stub (the same image, answering with the Host, CF-Connecting-IP and path it received)
      # holding the names atlas-api.atlas.svc and atlas-mcp.atlas.svc on a private network. Proven:
      #   - :8443 answers a handshake with NO SNI (as the router connects) with the service cert;
      #   - the security headers are on a live response of the public door;
      #   - from a trusted peer, X-Forwarded-For becomes CF-Connecting-IP and a client-sent
      #     CF-Connecting-IP is replaced (the sign-in throttle counts the client, not the proxy);
      #   - /mcp goes to atlas-mcp, the rest to atlas-api, each over the verified leg;
      #   - :9443 (atlas-mcp's door) reaches the api stub, and there a spoofed CF-Connecting-IP
      #     is replaced by the socket peer;
      #   - the readiness door (any other Host) serves /healthz through the api leg, nothing else;
      #   - no ACME attempt, no :80 listener.
      - name: "check: atlas-tls:ubi serves the OpenShift Caddyfile under an arbitrary UID"
        run: |
          set -euo pipefail
          img=atlas-tls:ubi
          user=$(docker image inspect -f '{{.Config.User}}' "$img")
          echo "$img: USER=$user"
          [[ "$user" =~ ^[1-9][0-9]*:0$ ]] || { echo "::error::$img: USER is not a numeric non-root UID in group 0"; exit 1; }
          fx="$RUNNER_TEMP/caddy-fixture"
          mkdir -p "$fx/ca" "$fx/sca" "$fx/tls" "$fx/stub"
          openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -days 2 \
            -subj "/CN=service-ca-fixture" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout "$fx/ca/ca.key" -out "$fx/sca/service-ca.crt" 2>/dev/null
          leaf() {  # dir name...
            local d=$1; shift
            local san; san=$(printf 'DNS:%s,' "$@"); san=${san%,}
            openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -subj "/CN=$1" \
              -keyout "$d/tls.key" -out "$d/tls.csr" 2>/dev/null
            printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\n' "$san" > "$d/ext"
            openssl x509 -req -in "$d/tls.csr" -CA "$fx/sca/service-ca.crt" -CAkey "$fx/ca/ca.key" \
              -CAcreateserial -days 2 -extfile "$d/ext" -out "$d/tls.crt" 2>/dev/null
            chmod 0644 "$d/tls.key"   # throwaway; the arbitrary UID must read the mount
          }
          leaf "$fx/tls" atlas-tls.atlas.svc
          leaf "$fx/stub" atlas-api.atlas.svc atlas-mcp.atlas.svc
          cat > "$fx/stub/Caddyfile" <<'CADDY'
          {
              admin off
              auto_https off
          }
          :8443 {
              tls /etc/caddy/tls.crt /etc/caddy/tls.key
              respond "port=8443 host={hostport} cfip={header.CF-Connecting-IP} path={path}"
          }
          :8493 {
              tls /etc/caddy/tls.crt /etc/caddy/tls.key
              respond "port=8493 host={hostport} cfip={header.CF-Connecting-IP} path={path}"
          }
          CADDY
          trap 'docker rm -f ubi-tls ubi-stub >/dev/null 2>&1 || true; docker network rm ubi-net >/dev/null 2>&1 || true' EXIT
          docker network create --subnet 198.51.100.0/24 --gateway 198.51.100.1 ubi-net >/dev/null
          docker run -d --name ubi-stub --network ubi-net \
            --network-alias atlas-api.atlas.svc --network-alias atlas-mcp.atlas.svc \
            -v "$fx/stub:/etc/caddy:ro" "$img" >/dev/null
          # The runner reaches the published ports through the network's gateway, which plays the
          # router here: CADDY_TRUSTED_PROXIES names it (and a second range, as an overlay may).
          tls_run() {
            docker run --user 1000770000:0 --read-only --tmpfs /config --tmpfs /data \
              -e XDG_CONFIG_HOME=/config -e XDG_DATA_HOME=/data \
              -e POD_NAMESPACE=atlas -e CADDY_PUBLIC_HOST=atlas.example.com \
              -e "CADDY_TRUSTED_PROXIES=198.51.100.1/32 192.0.2.0/24" -e CADDY_CLIENT_AUTH=off \
              -v "$GITHUB_WORKSPACE/deploy/openshift/base/caddy:/etc/caddy:ro" \
              -v "$fx/tls:/run/secrets/tls:ro" -v "$fx/sca:/run/config/service-ca:ro" "$@"
          }
          tls_run --rm --network none "$img" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile \
            || { echo "::error::$img: caddy validate failed on the OpenShift Caddyfile"; exit 1; }
          tls_run -d --name ubi-tls --network ubi-net -p 127.0.0.1:18443:8443 -p 127.0.0.1:19443:9443 \
            "$img" caddy run --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null
          fail() { docker logs ubi-tls || true; echo "::error::$img: $*"; exit 1; }
          pub=(--cacert "$fx/sca/service-ca.crt" --resolve atlas-tls.atlas.svc:18443:127.0.0.1 -H 'Host: atlas.example.com')
          body=""
          for _ in $(seq 1 30); do
            body=$(curl -s "${pub[@]}" https://atlas-tls.atlas.svc:18443/ready || true)
            [[ "$body" == port=8443* ]] && break
            sleep 1
          done
          [[ "$body" == port=8443* ]] || fail "the public door did not reach the api stub (got '$body')"
          subj=$(openssl s_client -connect 127.0.0.1:18443 -noservername </dev/null 2>/dev/null | openssl x509 -noout -subject)
          echo "no SNI on :8443 -> $subj"
          [[ "$subj" == *atlas-tls.atlas.svc* ]] || fail "default_sni did not select the service certificate"
          hdrs=$(curl -s -D - -o /dev/null "${pub[@]}" https://atlas-tls.atlas.svc:18443/)
          for h in 'strict-transport-security: max-age=31536000' 'x-frame-options: DENY' \
                   'x-content-type-options: nosniff' 'referrer-policy: same-origin' \
                   "content-security-policy: default-src 'self'; script-src 'self';"; do
            grep -qiF "$h" <<<"$hdrs" || fail "public door response lacks '$h'"
          done
          echo "security headers present on the public door"
          body=$(curl -s "${pub[@]}" -H 'X-Forwarded-For: 203.0.113.7' -H 'CF-Connecting-IP: 192.0.2.66' \
            https://atlas-tls.atlas.svc:18443/api/x)
          echo "trusted peer, XFF 203.0.113.7, spoofed CF-Connecting-IP -> $body"
          [ "$body" = "port=8443 host=atlas.example.com cfip=203.0.113.7 path=/api/x" ] \
            || fail "X-Forwarded-For from the trusted peer did not become CF-Connecting-IP"
          body=$(curl -s "${pub[@]}" -H 'X-Forwarded-For: 203.0.113.7' https://atlas-tls.atlas.svc:18443/mcp/)
          echo "/mcp -> $body"
          [[ "$body" == port=8493\ *cfip=203.0.113.7\ path=/mcp/ ]] || fail "/mcp did not reach atlas-mcp"
          body=$(curl -s --cacert "$fx/sca/service-ca.crt" --resolve atlas-tls.atlas.svc:19443:127.0.0.1 \
            -H 'X-Forwarded-For: 203.0.113.7' -H 'CF-Connecting-IP: 192.0.2.66' https://atlas-tls.atlas.svc:19443/api/me)
          echo ":9443 -> $body"
          [ "$body" = "port=8443 host=atlas-tls.atlas.svc:19443 cfip=198.51.100.1 path=/api/me" ] \
            || fail ":9443 did not reach the api stub with the socket peer as CF-Connecting-IP"
          body=$(curl -sk https://127.0.0.1:18443/healthz)
          echo "readiness door /healthz -> $body"
          [ "$body" = "port=8443 host=atlas.example.com cfip=198.51.100.1 path=/healthz" ] || fail "readiness door"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:18443/api/x)
          [ "$code" = 404 ] || fail "the readiness door served more than /healthz (got $code)"
          [ "$(docker inspect -f '{{.State.Running}}' ubi-tls)" = true ] || fail "caddy exited"
          # The log read whole first: `docker logs | grep -q` under pipefail can miss the match it
          # found (docker logs dies of SIGPIPE; TASK-1504), and both checks fail on a match.
          ubi_log=$(docker logs ubi-tls 2>&1)
          if grep -qi acme <<<"$ubi_log"; then fail "caddy tried ACME"; fi
          if grep -q ':80"' <<<"$ubi_log"; then fail "caddy opened a :80 listener"; fi
          echo "$img: the OpenShift Caddyfile serves as uid $(docker exec ubi-tls id -u) with a read-only root"

      - name: cache preflight
        id: preflight-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bin/preflight
          key: preflight-bin-${{ env.PREFLIGHT_VERSION }}-${{ env.PREFLIGHT_SHA256 }}

      - name: download preflight (checksum verified)
        if: steps.preflight-bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f=preflight-linux-amd64
          curl -fsSL --retry 3 -o "$f" "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${PREFLIGHT_VERSION}/$f"
          echo "$PREFLIGHT_SHA256  $f" | sha256sum -c -
          install -m 0755 "$f" bin/preflight

      # RED HAT PREFLIGHT (TASK-1483): `preflight check container`, the container-certification
      # policy, on each -ubi image. Preflight reads a registry, not the docker daemon, so each
      # image is pushed to a throwaway registry on the runner's loopback (plain HTTP, hence
      # --insecure) under a unique tag. Nothing is submitted to Red Hat; no account is needed.
      #   BLOCKING (a failure or an error fails the job): the checks about running on OpenShift
      #   and about what the image is.
      #     RunAsNonRoot           the restricted SCC refuses a root USER
      #     BasedOnUbi             the reason these images exist: a base Red Hat supports
      #     HasModifiedFiles       no RPM-installed file changed in a later layer, so the image
      #                            is still what Red Hat's errata (and scanners) describe
      #     HasNoProhibitedPackages  only UBI-redistributable packages
      #     HasLicense             /licenses carries the terms (LICENSE, NOTICE)
      #     HasRequiredLabel       name, vendor, version, release, summary, description
      #   REPORTED (a warning): the rest, which are about a certified catalogue listing or the
      #   push rather than the image running: HasUniqueTag (a property of the tag pushed; publish
      #   pushes the release tag), LayerCountAcceptable (fewer than 40 layers), and the
      #   trademark checks HasNoProhibitedLabels and HasProhibitedContainerName. Atlas does not
      #   certify; a check a newer preflight adds is reported too until it is classified here.
      #   A blocking check that does not run at all (renamed by a newer preflight) fails.
      # Also checked: each image's `name` label is the package it is published as.
      - name: "check: Red Hat preflight on the -ubi images"
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/preflight"
          mkdir -p "$out"
          preflight --version
          docker run -d --name pf-registry -p 127.0.0.1::5000 "$PREFLIGHT_REGISTRY_IMAGE" >/dev/null
          trap 'docker rm -f pf-registry >/dev/null 2>&1 || true' EXIT
          port=$(docker port pf-registry 5000/tcp | sed -n '1s/.*://p')
          for _ in $(seq 1 30); do curl -fsS "http://127.0.0.1:$port/v2/" >/dev/null 2>&1 && break; sleep 1; done
          blocking=(RunAsNonRoot BasedOnUbi HasModifiedFiles HasNoProhibitedPackages HasLicense HasRequiredLabel)
          echo "## Red Hat preflight $PREFLIGHT_VERSION (blocking: ${blocking[*]})" >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for pair in atlas-api:hardened-ubi=gradinai-atlas-api-ubi atlas-mcp:hardened-ubi=gradinai-atlas-mcp-ubi atlas-tls:ubi=gradinai-atlas-tls-ubi; do
            img=${pair%%=*}; name=${pair#*=}
            label=$(docker image inspect -f '{{index .Config.Labels "name"}}' "$img")
            [ "$label" = "$name" ] || { echo "::error::$img: label name is '$label', not $name"; bad=1; }
            ref="127.0.0.1:$port/$name:ci-${GITHUB_SHA::12}"
            docker tag "$img" "$ref"
            docker push -q "$ref" >/dev/null
            rc=0
            preflight check container "$ref" --insecure --artifacts "$out/$name" \
              > "$out/$name.json" 2> "$out/$name.log" || rc=$?
            echo "$name: preflight exit $rc"
            python3 - "$out/$name.json" "$name" "${blocking[@]}" <<'PY' || { bad=1; tail -n 30 "$out/$name.log" || true; }
          import json, os, sys
          path, name, *blocking = sys.argv[1:]
          with open(path, encoding="utf-8") as fh:
              results = json.load(fh)["results"]
          status = {c["name"]: (kind, c) for kind in ("passed", "failed", "errors")
                    for c in (results.get(kind) or [])}
          fail, rows = False, []
          for check, (kind, c) in sorted(status.items()):
              rows.append(f"| {name} | {check} | {kind} | {'blocking' if check in blocking else 'reported'} |")
              if kind == "passed":
                  print(f"{name}: passed {check}")
                  continue
              msg = f"{name}: {kind} {check}: {c.get('description', '')} {c.get('suggestion') or c.get('help') or ''}".strip()
              if check in blocking:
                  print(f"::error::{msg}")
                  fail = True
              else:
                  print(f"::warning::{msg} (reported, not blocking)")
          for check in blocking:
              if check not in status:
                  print(f"::error::{name}: the blocking check {check} did not run")
                  fail = True
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("\n| image | check | result | policy |\n|---|---|---|---|\n" + "\n".join(rows) + "\n")
          sys.exit(1 if fail else 0)
          PY
          done
          [ "$bad" = 0 ]

      - name: upload the preflight results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-preflight
          path: ${{ runner.temp }}/preflight
          if-no-files-found: warn
          retention-days: 30

      # The report names are what an `in` list in tools/ci/sca-accepted.json matches, so an image
      # built from the same recipe as one in sbom-sca.yml is reported under sbom-sca's name: one
      # acceptance then covers both runs, and sbom-sca's --full-scan knows every name.
      # atlas-postgres (pgvector.Dockerfile) is atlas-postgres-pgvector (sbom-sca's atlas-postgres is
      # the homelab's postgres:16); atlas-tls (deploy/caddy) is atlas-caddy. No --full-scan here:
      # this run sees eight images, so an acceptance for an image it does not scan is skipped.
      - name: scan the images
        run: |
          set -euo pipefail
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-api-hardened.json" atlas-api:hardened
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-mcp-hardened.json" atlas-mcp:hardened
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-backup.json" atlas-backup:release
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-postgres-pgvector.json" atlas-postgres:release
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-caddy.json" atlas-tls:release
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-api-hardened-ubi.json" atlas-api:hardened-ubi
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-mcp-hardened-ubi.json" atlas-mcp:hardened-ubi
          trivy image --quiet --scanners vuln --list-all-pkgs --format json -o "$RUNNER_TEMP/sca/atlas-caddy-ubi.json" atlas-tls:ubi

      - name: "gate: a fixable critical or high fails (tools/ci/sca_gate.py, sca-accepted.json)"
        run: python3 tools/ci/sca_gate.py "$RUNNER_TEMP/sca" --summary-md "$RUNNER_TEMP/sca/summary.md"

      - name: upload the scan reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images-sca
          path: ${{ runner.temp }}/sca
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: publish to GHCR (v* tags)
    needs: build-scan
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # public-ci: allow-permissions pushes the release images to GHCR, on tag pushes only
    permissions:
      contents: read
      packages: write
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
      mcp-digest: ${{ steps.mcp.outputs.digest }}
      backup-digest: ${{ steps.backup.outputs.digest }}
      postgres-digest: ${{ steps.postgres.outputs.digest }}
      tls-digest: ${{ steps.tls.outputs.digest }}
      api-ubi-digest: ${{ steps.api-ubi.outputs.digest }}
      mcp-ubi-digest: ${{ steps.mcp-ubi.outputs.digest }}
      tls-ubi-digest: ${{ steps.tls-ubi.outputs.digest }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Before anything is pushed: a tag that is not semver, or one with no release notes, stops
      # here and publishes nothing (docs/oss/RELEASES.md, "Versioning").
      - name: "release check: semver tag, notes in docs/oss/RELEASES.md"
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $tag is not vMAJOR.MINOR.PATCH[-prerelease] (docs/oss/RELEASES.md, Versioning)"; exit 1
          fi
          grep -qxF "## $tag" docs/oss/RELEASES.md || {
            echo "::error::docs/oss/RELEASES.md has no '## $tag' section: write the release notes first"; exit 1; }
          echo "tag $tag: semver, release notes present"

      - name: names
        id: names
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          for n in api mcp backup postgres tls api-ubi mcp-ubi tls-ubi; do
            echo "$n=ghcr.io/$owner/gradinai-atlas-$n" >> "$GITHUB_OUTPUT"
          done

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The job's own short-lived token, passed to the action as an input (not on a command line).
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: push atlas-api
        id: api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: hardened
          push: true
          tags: ${{ steps.names.outputs.api }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=atlas-api-hardened

      - name: push atlas-mcp
        id: mcp
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp
          target: hardened
          push: true
          tags: ${{ steps.names.outputs.mcp }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=atlas-mcp-hardened

      - name: push atlas-backup
        id: backup
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: backup
          push: true
          tags: ${{ steps.names.outputs.backup }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: |
            type=gha,scope=atlas-api-hardened
            type=gha,scope=atlas-backup

      - name: push atlas-postgres
        id: postgres
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/postgres
          file: deploy/postgres/pgvector.Dockerfile
          push: true
          tags: ${{ steps.names.outputs.postgres }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=atlas-postgres-release

      - name: push atlas-tls
        id: tls
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          push: true
          tags: ${{ steps.names.outputs.tls }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=atlas-tls-release

      # The OpenShift images (TASK-1483), from build-scan's cache scopes, so the scanned and
      # preflight-checked layers are the ones pushed. `version` and `release` are the tag and the
      # commit (their labels; build-scan set the same).
      - name: push atlas-api-ubi
        id: api-ubi
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: hardened-ubi
          build-args: |
            ATLAS_VERSION=${{ github.ref_name }}
            ATLAS_RELEASE=${{ github.sha }}
          push: true
          tags: ${{ steps.names.outputs.api-ubi }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            url=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=atlas-api-hardened-ubi

      - name: push atlas-mcp-ubi
        id: mcp-ubi
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp
          target: hardened-ubi
          build-contexts: repo=.
          build-args: |
            ATLAS_VERSION=${{ github.ref_name }}
            ATLAS_RELEASE=${{ github.sha }}
          push: true
          tags: ${{ steps.names.outputs.mcp-ubi }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            url=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=atlas-mcp-hardened-ubi

      - name: push atlas-tls-ubi
        id: tls-ubi
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deploy/caddy
          file: deploy/caddy/Dockerfile.ubi
          build-contexts: repo=.
          build-args: |
            ATLAS_VERSION=${{ github.ref_name }}
            ATLAS_RELEASE=${{ github.sha }}
          push: true
          tags: ${{ steps.names.outputs.tls-ubi }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
            url=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=atlas-tls-ubi

      # The eight references, tag AND digest, as the job summary and as release-images.env: the
      # five lines an install pastes into .env for deploy/oss/release.yml (variable names as in
      # .env.example's "Released images" block), then the three ATLAS_IMAGE_*_UBI lines, which
      # compose reads nothing of: an OpenShift overlay copies its digests from them
      # (deploy/openshift/README.md, "Images and releases"). install-smoke's upgrade job takes
      # exactly the five compose lines and ignores these.
      - name: digests and release-images.env
        env:
          API: ${{ steps.names.outputs.api }}@${{ steps.api.outputs.digest }}
          MCP: ${{ steps.names.outputs.mcp }}@${{ steps.mcp.outputs.digest }}
          BACKUP: ${{ steps.names.outputs.backup }}@${{ steps.backup.outputs.digest }}
          POSTGRES: ${{ steps.names.outputs.postgres }}@${{ steps.postgres.outputs.digest }}
          TLS: ${{ steps.names.outputs.tls }}@${{ steps.tls.outputs.digest }}
          API_UBI: ${{ steps.names.outputs.api-ubi }}@${{ steps.api-ubi.outputs.digest }}
          MCP_UBI: ${{ steps.names.outputs.mcp-ubi }}@${{ steps.mcp-ubi.outputs.digest }}
          TLS_UBI: ${{ steps.names.outputs.tls-ubi }}@${{ steps.tls-ubi.outputs.digest }}
        run: |
          set -euo pipefail
          ref() { local repo=${1%@*} digest=${1#*@}; echo "$repo:$GITHUB_REF_NAME@$digest"; }
          out="$RUNNER_TEMP/release-images.env"
          {
            echo "# Atlas $GITHUB_REF_NAME: the released images, for deploy/oss/release.yml."
            echo "# Paste into deploy/oss/.env, replacing any earlier ATLAS_IMAGE_* lines; keep the"
            echo "# checkout at $GITHUB_REF_NAME. docs/oss/RELEASES.md has the procedure."
            echo "ATLAS_IMAGE_API=$(ref "$API")"
            echo "ATLAS_IMAGE_MCP=$(ref "$MCP")"
            echo "ATLAS_IMAGE_BACKUP=$(ref "$BACKUP")"
            echo "ATLAS_IMAGE_POSTGRES=$(ref "$POSTGRES")"
            echo "ATLAS_IMAGE_TLS=$(ref "$TLS")"
            echo "# OpenShift (deploy/openshift): the UBI images, for an overlay's images: entries."
            echo "ATLAS_IMAGE_API_UBI=$(ref "$API_UBI")"
            echo "ATLAS_IMAGE_MCP_UBI=$(ref "$MCP_UBI")"
            echo "ATLAS_IMAGE_TLS_UBI=$(ref "$TLS_UBI")"
          } > "$out"
          # Every line carries a digest: a failed push output would leave `@` with nothing after.
          # The second grep has no -q, so it reads to the end and its writer never meets SIGPIPE
          # under pipefail, which would turn a line without a digest into a pass (TASK-1504).
          if grep '^ATLAS_IMAGE_' "$out" | grep -vE '@sha256:[0-9a-f]{64}$' > /dev/null; then
            cat "$out"; echo "::error::an image reference without a digest"; exit 1
          fi
          {
            echo "## Published images ($GITHUB_REF_NAME)"
            echo ""
            echo "| image | reference |"
            echo "|---|---|"
            grep '^ATLAS_IMAGE_' "$out" | sed -E 's/^([A-Z_]+)=(.*)$/| \1 | `\2` |/'
            echo ""
            echo "\`release-images.env\` (also attached to the GitHub release):"
            echo ""
            echo '```'
            cat "$out"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: upload release-images.env
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-images
          path: ${{ runner.temp }}/release-images.env
          if-no-files-found: error
          retention-days: 90

  release:
    name: draft GitHub release (notes from docs/oss/RELEASES.md)
    needs: publish
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # public-ci: allow-permissions writes the draft GitHub release, on tag pushes only
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The notes are the tag's section of RELEASES.md (its `## <tag>` heading up to the next
      # `## `), then the eight image references. The token is the job's own, read by gh from GH_TOKEN.
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          API_DIGEST: ${{ needs.publish.outputs.api-digest }}
          MCP_DIGEST: ${{ needs.publish.outputs.mcp-digest }}
          BACKUP_DIGEST: ${{ needs.publish.outputs.backup-digest }}
          POSTGRES_DIGEST: ${{ needs.publish.outputs.postgres-digest }}
          TLS_DIGEST: ${{ needs.publish.outputs.tls-digest }}
          API_UBI_DIGEST: ${{ needs.publish.outputs.api-ubi-digest }}
          MCP_UBI_DIGEST: ${{ needs.publish.outputs.mcp-ubi-digest }}
          TLS_UBI_DIGEST: ${{ needs.publish.outputs.tls-ubi-digest }}
        run: |
          set -euo pipefail
          tag=$GITHUB_REF_NAME
          owner=${GITHUB_REPOSITORY_OWNER,,}
          # release-images.env again, from publish's digests (the same lines as its artifact).
          env_file="$RUNNER_TEMP/release-images.env"
          {
            echo "# Atlas $tag: the released images, for deploy/oss/release.yml."
            echo "# Paste into deploy/oss/.env, replacing any earlier ATLAS_IMAGE_* lines; keep the"
            echo "# checkout at $tag. docs/oss/RELEASES.md has the procedure."
            echo "ATLAS_IMAGE_API=ghcr.io/$owner/gradinai-atlas-api:$tag@$API_DIGEST"
            echo "ATLAS_IMAGE_MCP=ghcr.io/$owner/gradinai-atlas-mcp:$tag@$MCP_DIGEST"
            echo "ATLAS_IMAGE_BACKUP=ghcr.io/$owner/gradinai-atlas-backup:$tag@$BACKUP_DIGEST"
            echo "ATLAS_IMAGE_POSTGRES=ghcr.io/$owner/gradinai-atlas-postgres:$tag@$POSTGRES_DIGEST"
            echo "ATLAS_IMAGE_TLS=ghcr.io/$owner/gradinai-atlas-tls:$tag@$TLS_DIGEST"
            echo "# OpenShift (deploy/openshift): the UBI images, for an overlay's images: entries."
            echo "ATLAS_IMAGE_API_UBI=ghcr.io/$owner/gradinai-atlas-api-ubi:$tag@$API_UBI_DIGEST"
            echo "ATLAS_IMAGE_MCP_UBI=ghcr.io/$owner/gradinai-atlas-mcp-ubi:$tag@$MCP_UBI_DIGEST"
            echo "ATLAS_IMAGE_TLS_UBI=ghcr.io/$owner/gradinai-atlas-tls-ubi:$tag@$TLS_UBI_DIGEST"
          } > "$env_file"
          # No -q on the second grep, so a line without a digest cannot pass on SIGPIPE (TASK-1504).
          if grep '^ATLAS_IMAGE_' "$env_file" | grep -vE '@sha256:[0-9a-f]{64}$' > /dev/null; then
            cat "$env_file"; echo "::error::an image reference without a digest"; exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v h="## $tag" '$0 == h {on = 1; next} on && /^## / {exit} on {print}' docs/oss/RELEASES.md > "$notes"
          {
            echo ""
            echo "### Images"
            echo ""
            echo "Pinned by tag and digest. Paste \`release-images.env\` (attached) into \`deploy/oss/.env\` and add"
            echo "\`release.yml\` to the compose files; [the procedure]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/docs/oss/RELEASES.md#upgrading-with-released-images)."
            echo "The three \`*_UBI\` lines are the OpenShift images, for an overlay's \`images:\` entries; compose reads none of them"
            echo "([deploy/openshift/README.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag/deploy/openshift/README.md#images-and-releases))."
            echo ""
            echo '```'
            grep '^ATLAS_IMAGE_' "$env_file"
            echo '```'
          } >> "$notes"
          pre=()
          [[ "$tag" == *-* ]] && pre=(--prerelease)
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
            gh release upload "$tag" "$env_file" --clobber
          else
            gh release create "$tag" --draft --verify-tag --title "Atlas $tag" --notes-file "$notes" "${pre[@]}" \
              "$env_file"
          fi
          {
            echo "## Release $tag"
            echo ""
            gh release view "$tag" --json url,isDraft -q '.url + (if .isDraft then " (draft)" else "" end)'
            echo ""
            echo "Publish it when the notes read right: \`gh release edit $tag --draft=false\`"
            echo "(that event attaches the SBOMs, sbom-sca.yml)."
          } | tee -a "$GITHUB_STEP_SUMMARY"
