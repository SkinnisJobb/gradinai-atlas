# DAST: OWASP ZAP against an ephemeral OSS install (STORY-atlas-lcm-plan, item 6).
#
# THE STACK is deploy/oss/docker-compose.yml installed exactly as the install smoke installs it
# (.github/workflows/install-smoke.yml, leg 1: `cp .env.example .env`, the public name set to
# atlas.test, scripts/init-secrets.sh, `docker compose up --build --wait`), on this runner only.
# Its users come from the same helpers: `atlas-admin user add`, then tests/bootstrap_users.py
# for the first sign-in and forced password change, then tools/ci/dast_session.py (built on
# tests/atlas_smoke.py) for a signed-in session.
#
# TWO SCANS:
#   baseline   zap-baseline.py: spider + passive rules over the public pages (landing, the
#              login form, whatever they link to), unauthenticated, as a stranger sees them
#   api        zap-api-scan.py: the OpenAPI document of THIS build (generated inside
#              atlas-api with app.openapi(); the live app serves no /openapi.json), active
#              rules, every request carrying the test user's session through a ZAP Replacer
#              rule (tools/ci/zap_auth_hook.py reads it from a file: never argv, never env)
#
# THE GATE: tools/ci/dast_gate.py. A High alert fails; everything else is in the summary and the
# `dast` artifact (14 days). tools/ci/dast-accepted.json can defer a false positive until a date.
#
# WHEN: master pushes, weekly, and by hand. NOT on pull requests (except one that changes the
# DAST files themselves, below): a full install plus an active
# scan is the most expensive run in this repo, and the account's Actions minutes are limited.
# Own workflow file: install-smoke.yml is not touched.
#
# SECRETS. Every credential is generated in the job, kept in a 0700 directory under
# $RUNNER_TEMP (the session cookie in the 0777 ZAP work dir as 0644, readable by ZAP's uid), and
# masked. No repository secret is used. The stack, its volumes and the files go at teardown.

name: dast

on:
  # Pull requests only when they change the DAST machinery itself, so a change to the scan is
  # proved on its own PR (workflow_dispatch cannot run a workflow that is not on master yet).
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/dast.yml"
      - "tools/ci/dast_*.py"
      - "tools/ci/dast-accepted.json"
      - "tools/ci/zap_auth_hook.py"
  schedule:
    - cron: "0 5 * * 1"       # Monday 05:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SMOKE_HOST: atlas.test
  SMOKE_URL: https://atlas.test
  # ZAP 2.17.0 (= `stable` on 2026-10-25), tag + digest.
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
  DAST_USER: dast

jobs:
  zap:
    name: ZAP baseline + authenticated API scan (OSS stack)
    # The OSS stack is compose project `atlas` with fixed host ports, so two stack jobs on the
    # self-hosted runners would collide. Only the runner labelled `<CI_RUNNER>-stack` takes them,
    # one at a time; the other runner keeps the light jobs (ops node atlas-ci-runner).
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements-lock.txt

      - name: prepare the runner
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/smoke"; mkdir -m 0700 "$SMOKE_DIR"
          ZAP_WRK="$RUNNER_TEMP/zap"; mkdir -m 0777 "$ZAP_WRK"
          {
            echo "SMOKE_DIR=$SMOKE_DIR"
            echo "ZAP_WRK=$ZAP_WRK"
            echo "SMOKE_CA=$GITHUB_WORKSPACE/deploy/oss/secrets/tls/ca.crt"
          } >> "$GITHUB_ENV"
          # The helpers need httpx; the hashed mcp lock brings it at the version atlas-mcp runs.
          pip install --quiet --require-hashes -r mcp/requirements-lock.txt
          echo "127.0.0.1 $SMOKE_HOST" | sudo tee -a /etc/hosts
          cp tools/ci/zap_auth_hook.py "$ZAP_WRK/"

      - name: install the OSS stack (as install-smoke leg 1)
        working-directory: deploy/oss
        run: |
          set -euo pipefail
          cp .env.example .env
          sed -i -e "s/atlas\.example\.com/$SMOKE_HOST/g" -e "s/privacy@example\.com/privacy@$SMOKE_HOST/" .env
          bash ../../scripts/init-secrets.sh >/dev/null
          docker compose up -d --build --wait --wait-timeout 600
          docker compose ps

      - name: a test user, signed in
        working-directory: deploy/oss
        run: |
          set -euo pipefail
          umask 077
          docker compose exec -T atlas-api atlas-admin --actor dast user add "$DAST_USER" --role owner > "$SMOKE_DIR/$DAST_USER.add"
          grep '^created' "$SMOKE_DIR/$DAST_USER.add"
          python ../../tests/bootstrap_users.py "$DAST_USER"
          python ../../tools/ci/dast_session.py "$DAST_USER" "$ZAP_WRK/session.cookie"

      - name: the OpenAPI document of this build
        working-directory: deploy/oss
        run: |
          set -euo pipefail
          docker compose exec -T atlas-api python -c \
            "import json, main; print(json.dumps(main.app.openapi()))" > "$ZAP_WRK/openapi.json"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); print(len(d['paths']), 'paths in the OpenAPI document')" "$ZAP_WRK/openapi.json"

      - name: "ZAP baseline: the public pages, unauthenticated"
        timeout-minutes: 15
        run: |
          set -uo pipefail
          rc=0
          docker run --rm --network host --add-host "$SMOKE_HOST:127.0.0.1" -v "$ZAP_WRK:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t "$SMOKE_URL/" -m 2 -I -J baseline.json -r baseline.html || rc=$?
          echo "zap-baseline exit $rc"
          [ "$rc" -lt 3 ] || { echo "zap-baseline did not complete" >&2; exit 1; }

      - name: "ZAP API scan: the OpenAPI document, with the test user's session"
        timeout-minutes: 30
        run: |
          set -uo pipefail
          rc=0
          docker run --rm --network host --add-host "$SMOKE_HOST:127.0.0.1" -v "$ZAP_WRK:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -O "$SMOKE_URL" -I \
              --hook /zap/wrk/zap_auth_hook.py \
              -z "-config scanner.maxScanDurationInMins=20 -config scanner.maxRuleDurationInMins=3" \
              -J api.json -r api.html || rc=$?
          echo "zap-api-scan exit $rc"
          [ "$rc" -lt 3 ] || { echo "zap-api-scan did not complete" >&2; exit 1; }

      - name: "gate: a High alert fails"
        if: ${{ !cancelled() }}
        run: |
          python tools/ci/dast_gate.py --self-test
          python tools/ci/dast_gate.py "$ZAP_WRK/baseline.json" "$ZAP_WRK/api.json"

      - name: collect compose logs (on failure)
        if: failure()
        working-directory: deploy/oss
        run: docker compose logs --no-color --timestamps > "$ZAP_WRK/compose-logs.txt" 2>&1 || true

      # The reports and logs only: the session cookie, the hook and the spec stay out.
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dast
          path: |
            ${{ runner.temp }}/zap/*.json
            ${{ runner.temp }}/zap/*.html
            ${{ runner.temp }}/zap/*.txt
            !${{ runner.temp }}/zap/openapi.json
          if-no-files-found: warn
          retention-days: 14

      - name: tear down
        if: always()
        working-directory: deploy/oss
        run: |
          docker compose down -v --remove-orphans || true
          rm -rf secrets "$SMOKE_DIR" "$ZAP_WRK/session.cookie"
