<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- GET /auth/logout: a one-button CONFIRMATION form. It does NOT end the session —
     only the POST does (TASK-967's rule: no state-changing GET, ever; a pre-fetching
     browser extension hitting a GET-that-logs-out is a real, boring bug).

     Why the plain URL exists at all: the app bar's account slot is display:none
     below 760px (board.html), so a phone user has no sign-out control on the board.
     This page is their path, and it is a URL that can be typed or bookmarked.

     Same hard rules as login.html: NO script element, NO third-party request, NO asset
     request. Substitution contract: {{csrf}} only.
     A logout that only clears the cookie is not a logout — the POST deletes the
     auth_session row server-side. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="same-origin">
<title>Sign out &middot; Project Atlas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2335699f' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%2335699f'/%3E%3C/svg%3E">
<style>
  :root {
    --ground: #eef1f5; --panel: #ffffff; --panel-2: #f7f9fb;
    --ink: #1b2531; --ink-soft: #56626f; --ink-faint: #8a94a1;
    --line: #dde2e9; --line-strong: #cbd2dc;
    --accent: #35699f; --accent-ink: #ffffff;
    --shadow: 0 1px 2px rgba(20,32,48,.04), 0 6px 20px rgba(20,32,48,.06);
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Cascadia Mono", Menlo, Consolas, monospace;
    --ui-scale: 1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #10141a; --panel: #191f27; --panel-2: #151a21;
      --ink: #e7ebf1; --ink-soft: #9aa5b3; --ink-faint: #6d7783;
      --line: #29313b; --line-strong: #363f4a;
      --accent: #6ea0dc; --accent-ink: #0d1218;
      --shadow: 0 1px 2px rgba(0,0,0,.30), 0 6px 20px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--font-sans); font-size: calc(15px * var(--ui-scale));
    line-height: 1.55;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    padding: 26px 26px 22px; text-align: left;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--font-mono); font-size: calc(11.5px * var(--ui-scale));
    letter-spacing: .10em; text-transform: uppercase; color: var(--ink-faint);
    margin-bottom: 16px;
  }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--accent); }
  h1 { margin: 0; font-size: calc(21px * var(--ui-scale)); letter-spacing: -.01em; }
  .sub { margin: 4px 0 18px; color: var(--ink-soft); font-size: calc(13px * var(--ui-scale)); }
  button {
    width: 100%; padding: 10px 14px; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 999px;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-sans); font-size: calc(14px * var(--ui-scale)); font-weight: 600;
    letter-spacing: .02em;
  }
  button:hover { filter: brightness(1.06); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .note {
    margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
    color: var(--ink-faint); font-size: calc(12px * var(--ui-scale));
  }
  .note a { color: var(--accent); }
  @media (max-width: 420px) {
    body { padding: 0; align-items: flex-start; background: var(--panel); }
    .card { max-width: none; border: 0; border-radius: 0; box-shadow: none; padding: 28px 20px; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="dot" aria-hidden="true"></span>Project Atlas</div>
  <h1>Sign out?</h1>
  <p class="sub">This ends the session on this device. Nothing has happened yet.</p>

  <form method="post" action="/auth/logout">
    <input type="hidden" name="csrf_token" value="{{csrf}}">
    <button type="submit">Sign out</button>
  </form>

  <p class="note">Changed your mind? <a href="/board">Back to the board</a></p>
</main>
</body>
</html>
