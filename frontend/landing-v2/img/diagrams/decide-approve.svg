<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 652" role="img" aria-labelledby="decide-approve-t decide-approve-d">
<title id="decide-approve-t">Agents propose, people decide</title>
<desc id="decide-approve-d">An agent, alex-claude, proposes new acceptance criteria on a task. The proposal is stored and shown on the task as a line-by-line comparison: one line removed, one added, one unchanged, with Approve and Reject buttons. Alex, a person signed in on the board, approves, and the list is replaced as Alex's own edit; the History tab records Alex's approval and who proposed it. The API refuses an agent's token two things: setting the criteria directly (403 acceptance_is_not_yours_to_write) and approving or rejecting a proposal (403 decision_needs_a_person).</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="652" rx="12"/>
<rect x="14" y="16" width="372" height="56" rx="8" class="ag"/>
<use href="#i-agent" x="26" y="32" width="24" height="24" class="ka"/>
<text x="60" y="40" class="b">alex-claude proposes new criteria</text>
<text x="60" y="60" class="m tm">atlas_update_work(propose_acceptance=true)</text>
<path d="M200 72 L200 98" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="100" width="372" height="196" rx="10" class="card"/>
<text x="28" y="126" class="b">Task · Acceptance</text>
<text x="28" y="146" class="s">Pending proposal, line by line:</text>
<rect x="28" y="156" width="344" height="30" rx="4" class="no"/>
<text x="40" y="176">−  Results are ranked</text>
<rect x="28" y="192" width="344" height="30" rx="4" class="ok"/>
<text x="40" y="212">+  Ranked by keyword and meaning</text>
<text x="40" y="244" class="s">   Search answers in under 1 s (same)</text>
<rect x="28" y="256" width="100" height="30" rx="6" class="pe"/>
<text x="78" y="276" class="b c">Approve</text>
<rect x="140" y="256" width="100" height="30" rx="6" class="card"/>
<text x="190" y="276" class="c">Reject</text>
<path d="M78 296 L78 326" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="328" width="372" height="72" rx="8" class="pe"/>
<use href="#i-person" x="26" y="340" width="24" height="24" class="kp"/>
<text x="60" y="352" class="b">Alex approves, signed in on</text>
<text x="60" y="372" class="b">the board</text>
<text x="60" y="391" class="s">the list is replaced as Alex's own edit</text>
<path d="M200 400 L200 424" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="426" width="372" height="74" rx="8" class="card"/>
<text x="28" y="449" class="b">History tab</text>
<text x="28" y="469" class="s">Acceptance proposed: alex-claude (agent)</text>
<text x="28" y="488" class="s">on behalf of Alex · approved: Alex</text>
<text x="14" y="538" class="h">What the API refuses an agent's token</text>
<use href="#i-cross" x="14" y="552" width="18" height="18" class="kno"/>
<text x="40" y="567">Setting the criteria directly</text>
<text x="40" y="586" class="m tno">403 acceptance_is_not_yours_to_write</text>
<use href="#i-cross" x="14" y="600" width="18" height="18" class="kno"/>
<text x="40" y="615">Approving or rejecting a proposal</text>
<text x="40" y="634" class="m tno">403 decision_needs_a_person</text>
</svg>
