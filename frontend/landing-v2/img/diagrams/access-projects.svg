<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 646" role="img" aria-labelledby="access-projects-t access-projects-d">
<title id="access-projects-t">Access follows the structure</title>
<desc id="access-projects-d">Alex signs in with the company account and belongs to the group search-team, which comes from sign-in. search-team holds the editor role on project A, so Alex can read and change its work, and the viewer role on project B, so Alex can read but not change it. Project C is private and Alex holds no role there: for Alex it does not exist, answered with a 404 like a missing page, never counted in a total and never found by search. The roles, each allowing a little more: viewer, editor, maintainer, owner. Roles go to people or groups; groups come from sign-in through an allow-list.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="646" rx="12"/>
<rect x="14" y="14" width="372" height="92" rx="8" class="pe"/>
<use href="#i-person" x="26" y="26" width="26" height="26" class="kp"/>
<text x="62" y="44" class="b">Alex</text>
<text x="62" y="64" class="s">signs in with the company account</text>
<rect x="62" y="74" width="230" height="24" rx="12" class="card"/>
<text x="74" y="91" class="s b">group: search-team</text>
<text x="300" y="91" class="s">from sign-in</text>
<rect x="14" y="138" width="372" height="96" rx="10" class="card"/>
<text x="28" y="164" class="b">Project A</text>
<rect x="204" y="148" width="170" height="26" rx="13" class="ok"/>
<text x="289" y="166" class="s b c">search-team: editor</text>
<text x="28" y="192" class="s">search-team holds editor here:</text>
<text x="28" y="212" class="s">Alex can read and change its work.</text>
<rect x="14" y="254" width="372" height="96" rx="10" class="card"/>
<text x="28" y="280" class="b">Project B</text>
<rect x="204" y="264" width="170" height="26" rx="13" class="card"/>
<text x="289" y="282" class="s b c">search-team: viewer</text>
<text x="28" y="308" class="s">search-team holds viewer here:</text>
<text x="28" y="328" class="s">Alex can read, not change.</text>
<rect x="14" y="370" width="372" height="112" rx="10" class="card d"/>
<text x="28" y="396" class="b tm">Project C (private)</text>
<text x="28" y="422">For Alex, this does not exist:</text>
<text x="28" y="444" class="s">a 404 like a missing page, never counted</text>
<text x="28" y="464" class="s">in a total, never found by search.</text>
<text x="14" y="516" class="b">Roles, each allowing a little more:</text>
<rect x="14" y="530" width="84" height="30" rx="15" class="card"/>
<text x="56" y="550" class="c">viewer</text>
<rect x="110" y="530" width="84" height="30" rx="15" class="card"/>
<text x="152" y="550" class="c">editor</text>
<text x="104" y="550" class="c tm">&lt;</text>
<rect x="206" y="530" width="84" height="30" rx="15" class="card"/>
<text x="248" y="550" class="c s">maintainer</text>
<text x="200" y="550" class="c tm">&lt;</text>
<rect x="302" y="530" width="84" height="30" rx="15" class="card"/>
<text x="344" y="550" class="c">owner</text>
<text x="296" y="550" class="c tm">&lt;</text>
<text x="14" y="592" class="s">Roles go to people or to groups. Groups come</text>
<text x="14" y="610" class="s">from your sign-in, through an allow-list you</text>
<text x="14" y="628" class="s">keep. A project is shared or private.</text>
</svg>
