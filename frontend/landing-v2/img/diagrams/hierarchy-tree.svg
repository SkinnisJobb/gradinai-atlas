<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 612" role="img" aria-labelledby="hierarchy-tree-t hierarchy-tree-d">
<title id="hierarchy-tree-t">Epic, story, task, tied to what it changes</title>
<desc id="hierarchy-tree-d">A three-level tree: one epic, Search by meaning, contains two stories, and each story contains two tasks. The epic has a solid works-on arrow to Search, a part of your system; the stories and tasks inherit that binding, drawn dashed, unless one names its own. Below: a level may be skipped, such as a task directly under an epic, but a repeated or inverted level, such as a story under a story or an epic under a task, is refused.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="612" rx="12"/>
<rect x="70" y="18" width="180" height="56" rx="8" class="card"/>
<text x="84" y="41" class="s b">EPIC</text>
<text x="84" y="62" class="b">Search by meaning</text>
<path d="M160 74 L89 108" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="110" width="150" height="56" rx="8" class="card"/>
<text x="26" y="133" class="s b">STORY</text>
<text x="26" y="154" class="b">index docs</text>
<path d="M89 166 L50 200" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="202" width="72" height="46" rx="6" class="card"/>
<text x="23" y="222" class="s b">TASK</text>
<text x="23" y="240" class="s">step 1</text>
<path d="M89 166 L128 200" class="ln" marker-end="url(#ar)"/>
<rect x="92" y="202" width="72" height="46" rx="6" class="card"/>
<text x="101" y="222" class="s b">TASK</text>
<text x="101" y="240" class="s">step 2</text>
<path d="M160 74 L251 108" class="ln" marker-end="url(#ar)"/>
<rect x="176" y="110" width="150" height="56" rx="8" class="card"/>
<text x="188" y="133" class="s b">STORY</text>
<text x="188" y="154" class="b">hybrid rank</text>
<path d="M251 166 L212 200" class="ln" marker-end="url(#ar)"/>
<rect x="176" y="202" width="72" height="46" rx="6" class="card"/>
<text x="185" y="222" class="s b">TASK</text>
<text x="185" y="240" class="s">step 1</text>
<path d="M251 166 L290 200" class="ln" marker-end="url(#ar)"/>
<rect x="254" y="202" width="72" height="46" rx="6" class="card"/>
<text x="263" y="222" class="s b">TASK</text>
<text x="263" y="240" class="s">step 2</text>
<rect x="90" y="334" width="160" height="56" rx="28" class="pe"/>
<text x="170" y="358" class="b c">Search</text>
<text x="170" y="378" class="s c">a part of your system</text>
<path d="M250 46 C372 46 384 300 252 356" class="ln" marker-end="url(#ar)" style="stroke:var(--person);stroke-width:2.5"/>
<text x="262" y="34" class="s b">works on</text>
<path d="M50 248 L116.0 330" class="ln d" marker-end="url(#ar)"/>
<path d="M128 248 L151.1 330" class="ln d" marker-end="url(#ar)"/>
<path d="M212 248 L188.9 330" class="ln d" marker-end="url(#ar)"/>
<path d="M290 248 L224.0 330" class="ln d" marker-end="url(#ar)"/>
<text x="14" y="296" class="s">inherited</text>
<text x="14" y="424">The epic says once what it works on.</text>
<text x="14" y="444">Its stories and tasks inherit it (dashed),</text>
<text x="14" y="464">unless one names its own.</text>
<path d="M14 486 L386 486" class="ln d"/>
<text x="14" y="516" class="b">The levels: epic › story › task</text>
<use href="#i-tick" x="14" y="530" width="18" height="18" class="kok"/>
<text x="40" y="545">A level may be skipped: task under epic</text>
<use href="#i-cross" x="14" y="558" width="18" height="18" class="kno"/>
<text x="40" y="573">Repeated or upside down is refused:</text>
<text x="40" y="592" class="s">story under story, epic under task</text>
</svg>
