<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 694" role="img" aria-labelledby="problem-before-after-t problem-before-after-d">
<title id="problem-before-after-t">Five chats, no plan; then one board</title>
<desc id="problem-before-after-d">Before: five separate chat bubbles, each holding a task and a question mark, with nothing connecting them, so nobody sees the whole and a question waits unseen. After: the same five tasks as cards on one board with To do, In progress, Blocked and Done columns, each assigned to a person. Blocked work shows red, and a proposed change to a task's acceptance criteria waits on the item until a person approves or rejects it.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="694" rx="12"/>
<text x="14" y="34" class="h">Before: the plan lives in the chats</text>
<path d="M22 50h164a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H54l-14 12v-12H22a8 8 0 0 1-8-8V58a8 8 0 0 1 8-8z" class="card"/>
<text x="28" y="74">Chat 1: a task</text>
<text x="28" y="94" class="s">and a question</text>
<circle cx="166" cy="79" r="12" class="wa"/>
<text x="166" y="85" class="b c twa">?</text>
<path d="M214 50h164a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H246l-14 12v-12H214a8 8 0 0 1-8-8V58a8 8 0 0 1 8-8z" class="card"/>
<text x="220" y="74">Chat 2: a task</text>
<text x="220" y="94" class="s">and a question</text>
<circle cx="358" cy="79" r="12" class="wa"/>
<text x="358" y="85" class="b c twa">?</text>
<path d="M22 134h164a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H54l-14 12v-12H22a8 8 0 0 1-8-8V142a8 8 0 0 1 8-8z" class="card"/>
<text x="28" y="158">Chat 3: a task</text>
<text x="28" y="178" class="s">and a question</text>
<circle cx="166" cy="163" r="12" class="wa"/>
<text x="166" y="169" class="b c twa">?</text>
<path d="M214 134h164a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H246l-14 12v-12H214a8 8 0 0 1-8-8V142a8 8 0 0 1 8-8z" class="card"/>
<text x="220" y="158">Chat 4: a task</text>
<text x="220" y="178" class="s">and a question</text>
<circle cx="358" cy="163" r="12" class="wa"/>
<text x="358" y="169" class="b c twa">?</text>
<path d="M118 218h164a8 8 0 0 1 8 8v42a8 8 0 0 1-8 8H150l-14 12v-12H118a8 8 0 0 1-8-8V226a8 8 0 0 1 8-8z" class="card"/>
<text x="124" y="242">Chat 5: a task</text>
<text x="124" y="262" class="s">and a question</text>
<circle cx="262" cy="247" r="12" class="wa"/>
<text x="262" y="253" class="b c twa">?</text>
<text x="14" y="312" class="s">No links between them. Nobody sees the whole,</text>
<text x="14" y="330" class="s">and a question waits where nobody is looking.</text>
<path d="M14 348 L386 348" class="ln d"/>
<text x="14" y="380" class="h">After: one plan everyone works from</text>
<rect x="14" y="396" width="372" height="214" rx="12" class="card"/>
<text x="66" y="420" class="s c">To do</text>
<text x="156" y="420" class="s c">In progress</text>
<path d="M111 406 L111 600" class="card"/>
<text x="246" y="420" class="s c">Blocked</text>
<path d="M201 406 L201 600" class="card"/>
<text x="336" y="420" class="s c">Done</text>
<path d="M291 406 L291 600" class="card"/>
<rect x="24" y="430" width="84" height="44" rx="6" class="card"/>
<text x="33" y="449" class="b">Task</text>
<text x="33" y="466" class="s">Alex</text>
<rect x="24" y="480" width="84" height="44" rx="6" class="card"/>
<text x="33" y="499" class="b">Task</text>
<text x="33" y="516" class="s">Alex</text>
<rect x="114" y="430" width="84" height="44" rx="6" class="card"/>
<text x="123" y="449" class="b">Task</text>
<text x="123" y="466" class="s">Alex</text>
<rect x="204" y="430" width="84" height="44" rx="6" class="no"/>
<text x="213" y="449" class="b">Task</text>
<text x="213" y="466" class="s tno">Blocked</text>
<rect x="294" y="430" width="84" height="44" rx="6" class="ok"/>
<text x="303" y="449" class="b">Task</text>
<text x="303" y="466" class="s tok">Done</text>
<path d="M156 474 L156 534" class="ln d"/>
<rect x="110" y="536" width="266" height="64" rx="8" class="pe d"/>
<text x="124" y="559" class="b">Proposed criteria</text>
<text x="124" y="579" class="s">waits on the item for Alex</text>
<text x="14" y="638" class="s">The same five tasks, each assigned to a person.</text>
<text x="14" y="656" class="s">Blocked work shows red; a change to what</text>
<text x="14" y="674" class="s">“done” means waits on the item for a person.</text>
</svg>
