<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 714" role="img" aria-labelledby="agent-key-t agent-key-d">
<title id="agent-key-t">The agent's own key</title>
<desc id="agent-key-d">An agent, alex-claude, holds its own token, with scopes read and write, an expiry, and the option to revoke it. The token is linked to its person, Alex. atlas-mcp passes the token on and holds no rules. atlas-api checks every call: the token is valid, not expired and not revoked; the scope allows the action; the agent sees what Alex may see, plus anything granted to the agent itself; and Alex is not disabled. When Alex loses project B, the agent's next call no longer sees it. A token's scope caps its role: read to viewer, write to editor, admin to maintainer; no token acts as owner.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="714" rx="12"/>
<rect x="14" y="14" width="236" height="54" rx="8" class="ag"/>
<use href="#i-agent" x="26" y="29" width="24" height="24" class="ka"/>
<text x="60" y="47" class="b">alex-claude</text>
<path d="M132 68 L132 92" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="94" width="236" height="70" rx="8" class="card"/>
<use href="#i-key" x="26" y="106" width="24" height="24" class="ka"/>
<text x="60" y="118" class="b">Its own token</text>
<text x="60" y="138" class="s">scopes: read, write</text>
<text x="60" y="156" class="s">expires; revocable</text>
<rect x="270" y="94" width="116" height="70" rx="8" class="pe"/>
<use href="#i-person" x="280" y="104" width="24" height="24" class="kp"/>
<text x="310" y="122" class="b">Alex</text>
<text x="282" y="150" class="s">its person</text>
<path d="M250 129 L270 129" class="ln"/>
<path d="M132 164 L132 188" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="190" width="236" height="60" rx="8" class="card d"/>
<text x="28" y="214" class="b">atlas-mcp</text>
<text x="28" y="236" class="s">passes the token on; no rules</text>
<path d="M132 250 L132 274" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="276" width="372" height="172" rx="10" class="card"/>
<rect x="14" y="276" width="8" height="172" rx="4" fill="var(--ink)"/>
<text x="34" y="302" class="b">atlas-api checks every call</text>
<use href="#i-tick" x="34" y="318" width="18" height="18" class="kok"/>
<text x="60" y="332">token valid, not expired, not revoked</text>
<use href="#i-tick" x="34" y="348" width="18" height="18" class="kok"/>
<text x="60" y="362">the scope allows this action</text>
<use href="#i-tick" x="34" y="378" width="18" height="18" class="kok"/>
<text x="60" y="392">Alex's access, plus its own grants</text>
<use href="#i-tick" x="34" y="408" width="18" height="18" class="kok"/>
<text x="60" y="422">Alex is not disabled</text>
<path d="M200 448 L200 472" class="ln" marker-end="url(#ar)"/>
<rect x="130" y="474" width="140" height="40" rx="20" class="card"/>
<text x="200" y="499" class="b c">the graph</text>
<text x="14" y="548" class="b">When Alex loses a project</text>
<rect x="14" y="560" width="176" height="44" rx="6" class="card"/>
<text x="26" y="587">Project A</text>
<rect x="210" y="560" width="176" height="44" rx="6" class="card d"/>
<text x="222" y="587" class="tm">Project B</text>
<use href="#i-cross" x="356" y="573" width="18" height="18" class="kno"/>
<text x="14" y="630">the agent's next call no longer sees B.</text>
<text x="14" y="660" class="s">A token's scope caps its role: read → viewer,</text>
<text x="14" y="678" class="s">write → editor, admin → maintainer. No token</text>
<text x="14" y="696" class="s">acts as owner.</text>
</svg>
