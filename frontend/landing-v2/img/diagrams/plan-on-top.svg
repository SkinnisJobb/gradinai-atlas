<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" role="img" aria-labelledby="plan-on-top-t plan-on-top-d">
<title id="plan-on-top-t">A fresh install describes itself</title>
<desc id="plan-on-top-d">A fresh install starts with a map of its own parts: the Atlas system node and six children, atlas-api, atlas-mcp, Search, atlas-postgres, atlas-gateway and the Retrieval add-on, each with its documents. Two epics of your own work sit on top, each with a works-on arrow to the part it changes. An agent edits one part's document with atlas_doc_write. The handbook at /docs is the shipped text of the same documents; edits made in your install show on the board and through MCP.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="670" rx="12"/>
<text x="14" y="32" class="h">Your work, planned on top</text>
<rect x="14" y="46" width="176" height="54" rx="8" class="card"/>
<text x="26" y="68" class="s b">EPIC</text>
<text x="26" y="89" class="b">Faster sign-in</text>
<rect x="210" y="46" width="176" height="54" rx="8" class="card"/>
<text x="222" y="68" class="s b">EPIC</text>
<text x="222" y="89" class="b">Better search</text>
<rect x="14" y="130" width="372" height="296" rx="12" class="pe"/>
<text x="28" y="386" class="b">Atlas (system)</text>
<text x="28" y="408" class="s">what a fresh install starts with: six parts</text>
<rect x="24" y="150" width="112" height="62" rx="8" class="card"/>
<text x="34" y="174" class="b">atlas-api</text>
<text x="34" y="194" class="s">service</text>
<use href="#i-doc" x="112" y="184" width="20" height="20" class="km"/>
<rect x="144" y="150" width="112" height="62" rx="8" class="card"/>
<text x="154" y="174" class="b">atlas-mcp</text>
<text x="154" y="194" class="s">service</text>
<use href="#i-doc" x="232" y="184" width="20" height="20" class="km"/>
<rect x="264" y="150" width="112" height="62" rx="8" class="card"/>
<text x="274" y="174" class="b">Search</text>
<text x="274" y="194" class="s">capability</text>
<use href="#i-doc" x="352" y="184" width="20" height="20" class="km"/>
<rect x="24" y="248" width="112" height="62" rx="8" class="card"/>
<text x="34" y="272" class="b s">atlas-postgres</text>
<text x="34" y="292" class="s">database</text>
<use href="#i-doc" x="112" y="282" width="20" height="20" class="km"/>
<rect x="144" y="248" width="112" height="62" rx="8" class="card"/>
<text x="154" y="272" class="b s">atlas-gateway</text>
<text x="154" y="292" class="s">service</text>
<use href="#i-doc" x="232" y="282" width="20" height="20" class="km"/>
<rect x="264" y="248" width="112" height="62" rx="8" class="card"/>
<text x="274" y="272" class="b">Retrieval</text>
<text x="274" y="292" class="s">add-on</text>
<use href="#i-doc" x="352" y="282" width="20" height="20" class="km"/>
<path d="M80 100 L80 148" class="ln" marker-end="url(#ar)"/>
<path d="M320 100 L320 148" class="ln" marker-end="url(#ar)"/>
<text x="88" y="120" class="s">works on</text>
<text x="312" y="120" class="s r">works on</text>
<rect x="14" y="458" width="372" height="58" rx="8" class="ag"/>
<use href="#i-agent" x="26" y="474" width="24" height="24" class="ka"/>
<text x="60" y="481" class="b">alex-claude edits a node's document</text>
<text x="60" y="503" class="m tm">atlas_doc_write</text>
<path d="M340 458 L340 312" class="ln" marker-end="url(#ar)"/>
<text x="14" y="548">Every part comes with its documents. You add</text>
<text x="14" y="568">your own parts beside them, and you or your</text>
<text x="14" y="588">agents change any of it as the system changes.</text>
<text x="14" y="616" class="s">The handbook at /docs is the shipped text of</text>
<text x="14" y="634" class="s">the same documents; your edits show on the</text>
<text x="14" y="652" class="s">board and through MCP.</text>
</svg>
