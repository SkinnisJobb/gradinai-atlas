<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 638" role="img" aria-labelledby="how-it-works-t how-it-works-d">
<title id="how-it-works-t">One graph, one gate</title>
<desc id="how-it-works-d">Three kinds of caller: the board in a browser, scripts using the REST API, and agents in any MCP client. All arrive through a front door you can swap: the bundled TLS ingress or your own reverse proxy, and for agents optionally an MCP gateway. Agents pass through atlas-mcp, which holds no rules. Everything reaches atlas-api, which runs one deny-by-default check on every request and knows a caller only by a session cookie or a Bearer token. Behind it, Postgres holds one graph: the map, the work, rules, documents, comments and history. A forged header claiming to be admin is ignored; a misconfigured front can refuse requests but cannot widen access.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="638" rx="12"/>
<rect x="14" y="14" width="120" height="54" rx="8" class="card"/>
<text x="26" y="37" class="b">Board</text>
<text x="26" y="57" class="s">a browser</text>
<path d="M74 68 L74 96" class="ln" marker-end="url(#ar)"/>
<rect x="140" y="14" width="120" height="54" rx="8" class="card"/>
<text x="152" y="37" class="b">Scripts</text>
<text x="152" y="57" class="s">the REST API</text>
<path d="M200 68 L200 96" class="ln" marker-end="url(#ar)"/>
<rect x="266" y="14" width="120" height="54" rx="8" class="ag"/>
<text x="278" y="37" class="b">Agents</text>
<text x="278" y="57" class="s">any MCP client</text>
<path d="M326 68 L326 96" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="98" width="372" height="62" rx="10" class="card d"/>
<text x="28" y="122">A front door: the bundled TLS ingress</text>
<text x="28" y="144" class="s">or your proxy; for agents, an MCP gateway</text>
<path d="M74 160 L74 256" class="ln" marker-end="url(#ar)"/>
<path d="M200 160 L200 256" class="ln" marker-end="url(#ar)"/>
<path d="M326 160 L326 180" class="ln" marker-end="url(#ar)"/>
<rect x="266" y="182" width="120" height="50" rx="8" class="ag"/>
<text x="278" y="204" class="b">atlas-mcp</text>
<text x="278" y="223" class="s">no rules</text>
<path d="M326 232 L326 256" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="258" width="372" height="112" rx="10" class="card"/>
<rect x="14" y="258" width="372" height="8" rx="4" fill="var(--ink)"/>
<text x="28" y="290" class="b">atlas-api: one check on every request</text>
<text x="28" y="312" class="s">Denies by default, including routes added later.</text>
<text x="28" y="332" class="s">Who is calling: a session cookie or a</text>
<text x="28" y="352" class="s">Bearer token, and nothing else.</text>
<path d="M200 370 L200 396" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="398" width="372" height="74" rx="10" class="pe"/>
<text x="28" y="424" class="b">Postgres: one graph</text>
<text x="28" y="446" class="s">the map, the work, rules, documents,</text>
<text x="28" y="464" class="s">comments and history, as rows</text>
<path d="M14 494 L386 494" class="ln d"/>
<rect x="14" y="510" width="160" height="40" rx="8" class="no"/>
<text x="26" y="535" class="m">X-User: admin</text>
<use href="#i-cross" x="182" y="520" width="20" height="20" class="kno"/>
<text x="212" y="527" class="s">A header that claims</text>
<text x="212" y="545" class="s">an identity is ignored</text>
<text x="14" y="584" class="s">The front can be swapped. A badly configured</text>
<text x="14" y="602" class="s">one can refuse requests, but it cannot widen</text>
<text x="14" y="620" class="s">anyone's access.</text>
</svg>
