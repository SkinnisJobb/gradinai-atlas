<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 680" role="img" aria-labelledby="context-ask-open-t context-ask-open-d">
<title id="context-ask-open-t">Ask, then open</title>
<desc id="context-ask-open-d">An agent asks one question, what touches search, with one call, atlas_context. The answer is six short lists of pointers: seeds (the best matches, cap 5), neighbourhood (what sits around them, cap 20), impact (what a change would affect, cap 20), intents (the rules that apply, cap 20), decisions (decision records, cap 5) and docs (documents to read next, cap 10). Each list has a cap and says when it was cut. The agent then opens one document with atlas_doc_read, and only that document's full text is returned.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="680" rx="12"/>
<rect x="14" y="14" width="372" height="58" rx="8" class="ag"/>
<use href="#i-agent" x="26" y="31" width="24" height="24" class="ka"/>
<text x="60" y="38" class="b">“What touches search?”</text>
<text x="60" y="60" class="m tm">atlas_context(about="search")</text>
<path d="M200 72 L200 96" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="98" width="372" height="366" rx="10" class="card"/>
<text x="28" y="124" class="b">One answer: six short lists of pointers</text>
<text x="30" y="156" class="b">seeds</text>
<text x="30" y="176" class="s">the best matches</text>
<text x="372" y="156" class="s r">cap 5</text>
<rect x="292" y="166" width="80" height="9" rx="4" class="card"/>
<rect x="292" y="166" width="48" height="9" rx="4" class="ok"/>
<text x="30" y="208" class="b">neighbourhood</text>
<text x="30" y="228" class="s">what sits around them</text>
<text x="372" y="208" class="s r">cap 20</text>
<rect x="292" y="218" width="80" height="9" rx="4" class="card"/>
<rect x="292" y="218" width="36" height="9" rx="4" class="ok"/>
<text x="30" y="260" class="b">impact</text>
<text x="30" y="280" class="s">what a change would affect</text>
<text x="372" y="260" class="s r">cap 20</text>
<rect x="292" y="270" width="80" height="9" rx="4" class="card"/>
<rect x="292" y="270" width="24" height="9" rx="4" class="ok"/>
<text x="30" y="312" class="b">intents</text>
<text x="30" y="332" class="s">the rules that apply</text>
<text x="372" y="312" class="s r">cap 20</text>
<rect x="292" y="322" width="80" height="9" rx="4" class="card"/>
<rect x="292" y="322" width="16" height="9" rx="4" class="ok"/>
<text x="30" y="364" class="b">decisions</text>
<text x="30" y="384" class="s">decision records (ADRs)</text>
<text x="372" y="364" class="s r">cap 5</text>
<rect x="292" y="374" width="80" height="9" rx="4" class="card"/>
<rect x="292" y="374" width="32" height="9" rx="4" class="ok"/>
<rect x="22" y="396" width="356" height="50" rx="6" class="ag"/>
<text x="30" y="416" class="b">docs</text>
<text x="30" y="436" class="s">documents to read next</text>
<text x="372" y="416" class="s r">cap 10</text>
<rect x="292" y="426" width="80" height="9" rx="4" class="card"/>
<rect x="292" y="426" width="32" height="9" rx="4" class="ok"/>
<path d="M200 444 L200 490" class="ln" marker-end="url(#ar)"/>
<text x="210" y="474" class="m tm">atlas_doc_read</text>
<rect x="14" y="492" width="372" height="104" rx="10" class="card"/>
<use href="#i-doc" x="26" y="504" width="24" height="24" class="ka"/>
<text x="58" y="522" class="b">Only this document opens</text>
<rect x="28" y="538" width="300" height="6" rx="3" class="card"/>
<rect x="28" y="551" width="270" height="6" rx="3" class="card"/>
<rect x="28" y="564" width="310" height="6" rx="3" class="card"/>
<rect x="28" y="577" width="180" height="6" rx="3" class="card"/>
<text x="14" y="626" class="s">Each list has a cap and says when it was cut</text>
<text x="14" y="644" class="s">(truncated). Read the pointers first; open the</text>
<text x="14" y="662" class="s">full text only for what the task needs.</text>
</svg>
