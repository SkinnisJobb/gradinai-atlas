<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 670" role="img" aria-labelledby="hero-one-plan-narrow-t hero-one-plan-narrow-d">
<title id="hero-one-plan-narrow-t">One plan, many agents</title>
<desc id="hero-one-plan-narrow-d">Three agents working for one person, Alex, file task cards into one board: one epic lane with To do, In progress, Blocked and Done columns, every task assigned to Alex. A blocked card shows red; a done card green with a tick. On the in-progress task an agent has proposed new acceptance criteria, which wait on the item for a person. An arrow takes the proposal to Alex, the person the task is assigned to, who approves it. Agents cannot assign work or approve their own criteria; a person does.</desc>
<style>
svg{--bg:#ffffff;--surface:#f4f5f7;--ink:#1d2127;--muted:#58616c;--line:#c5cbd3;--agent:#2457c5;--agent-soft:#e7eefc;--person:#0a7565;--person-soft:#e0f3ef;--ok:#1b7a34;--ok-soft:#e3f3e7;--warn:#a85300;--warn-soft:#fdf0e0;--bad:#bf2a2a;--bad-soft:#fbe9e9}
@media (prefers-color-scheme:dark){svg{--bg:#16191e;--surface:#21252c;--ink:#e8eaed;--muted:#a6aeb8;--line:#3d444f;--agent:#86abff;--agent-soft:#1d2a45;--person:#55cdb8;--person-soft:#15322d;--ok:#5cc777;--ok-soft:#173020;--warn:#f2a457;--warn-soft:#3a2a15;--bad:#ff8585;--bad-soft:#3d1d1d}}
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:var(--ink)}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px}
.s{font-size:13px;fill:var(--muted)}
.b{font-weight:600}
.h{font-size:17px;font-weight:700}
.c{text-anchor:middle}
.r{text-anchor:end}
.bg{fill:var(--bg)}
.card{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.d{stroke-dasharray:5 4}
.ah{fill:var(--muted)}
.ag{fill:var(--agent-soft);stroke:var(--agent);stroke-width:1.5}
.pe{fill:var(--person-soft);stroke:var(--person);stroke-width:1.5}
.ok{fill:var(--ok-soft);stroke:var(--ok);stroke-width:2}
.wa{fill:var(--warn-soft);stroke:var(--warn);stroke-width:2}
.no{fill:var(--bad-soft);stroke:var(--bad);stroke-width:2}
.ta{fill:var(--agent)}.tp{fill:var(--person)}.tok{fill:var(--ok)}.twa{fill:var(--warn)}.tno{fill:var(--bad)}.tm{fill:var(--muted)}
.ka{color:var(--agent)}.kp{color:var(--person)}.kok{color:var(--ok)}.kno{color:var(--bad)}.kwa{color:var(--warn)}.km{color:var(--muted)}
</style>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
<symbol id="i-agent" viewBox="0 0 20 20"><rect x="3" y="6" width="14" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.8" cy="11.5" r="1.5" fill="currentColor"/><circle cx="12.2" cy="11.5" r="1.5" fill="currentColor"/><path d="M10 6V2.5" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-person" viewBox="0 0 20 20"><circle cx="10" cy="6.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 18.5c0-4.2 3-6.6 6.8-6.6s6.8 2.4 6.8 6.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
<symbol id="i-tick" viewBox="0 0 20 20"><path d="M4 10.5l4 4 8-9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-cross" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></symbol>
<symbol id="i-doc" viewBox="0 0 20 20"><path d="M5 2.5h7l3.5 3.5v11.5h-10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M7.5 9.5h5M7.5 12.5h5" stroke="currentColor" stroke-width="1.3"/></symbol>
<symbol id="i-key" viewBox="0 0 20 20"><circle cx="6.5" cy="10" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.3 10H18M15 10v3M17.5 10v2.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
</defs>
<rect class="bg" width="400" height="670" rx="12"/>
<text x="14" y="34" class="h">Three agents, working for Alex</text>
<rect x="14" y="50" width="120" height="50" rx="8" class="ag"/>
<use href="#i-agent" x="21" y="54" width="20" height="20" class="ka"/>
<text x="24" y="90" class="m">alex-claude</text>
<path d="M74 100 L74 134" class="ln" marker-end="url(#ar)"/>
<rect x="139" y="50" width="120" height="50" rx="8" class="ag"/>
<use href="#i-agent" x="146" y="54" width="20" height="20" class="ka"/>
<text x="149" y="90" class="m">alex-review</text>
<path d="M199 100 L199 134" class="ln" marker-end="url(#ar)"/>
<rect x="264" y="50" width="120" height="50" rx="8" class="ag"/>
<use href="#i-agent" x="271" y="54" width="20" height="20" class="ka"/>
<text x="274" y="90" class="m">alex-docs</text>
<path d="M324 100 L324 134" class="ln" marker-end="url(#ar)"/>
<rect x="14" y="138" width="372" height="300" rx="12" class="card"/>
<text x="28" y="166" class="h">One plan, on one board</text>
<text x="28" y="188" class="s">Epic lane: Search by meaning</text>
<text x="66" y="214" class="s c">To do</text>
<text x="156" y="214" class="s c">In progress</text>
<path d="M111 200 L111 428" class="card"/>
<text x="246" y="214" class="s c">Blocked</text>
<path d="M201 200 L201 428" class="card"/>
<text x="336" y="214" class="s c">Done</text>
<path d="M291 200 L291 428" class="card"/>
<rect x="24" y="224" width="84" height="50" rx="6" class="card"/>
<text x="34" y="245" class="b">Task</text>
<text x="34" y="264" class="s">Alex</text>
<rect x="24" y="282" width="84" height="50" rx="6" class="card"/>
<text x="34" y="303" class="b">Task</text>
<text x="34" y="322" class="s">Alex</text>
<rect x="114" y="224" width="84" height="50" rx="6" class="card"/>
<text x="124" y="245" class="b">Task</text>
<text x="124" y="264" class="s">Alex</text>
<rect x="204" y="224" width="84" height="50" rx="6" class="no"/>
<text x="214" y="245" class="b">Task</text>
<text x="214" y="264" class="s tno">Blocked</text>
<text x="279" y="246" class="b tno r">!</text>
<rect x="294" y="224" width="84" height="50" rx="6" class="ok"/>
<text x="304" y="245" class="b">Task</text>
<text x="304" y="264" class="s tok">Done</text>
<use href="#i-tick" x="358" y="228" width="16" height="16" class="kok"/>
<path d="M156 274 L156 340" class="ln d"/>
<rect x="90" y="342" width="176" height="52" rx="8" class="pe d"/>
<text x="102" y="364" class="b">Proposed criteria</text>
<text x="102" y="383" class="s">only Alex can approve</text>
<path d="M140 394 L140 492" class="ln" marker-end="url(#ar)"/>
<text x="132" y="470" class="s r">waits on a person</text>
<rect x="120" y="496" width="190" height="64" rx="8" class="pe"/>
<use href="#i-person" x="130" y="506" width="24" height="24" class="kp"/>
<text x="162" y="522" class="b">Alex</text>
<text x="162" y="543" class="s">the assignee, a person</text>
<path d="M310 528 L340 528 L340 418 L230 418 L230 396" class="ln" marker-end="url(#ar)"/>
<text x="332" y="470" class="s r">Alex approves</text>
<text x="14" y="618" class="s">Agents file and update work through Atlas's</text>
<text x="14" y="636" class="s">MCP server. They cannot assign it, or approve</text>
<text x="14" y="654" class="s">their own criteria: a person does.</text>
</svg>
