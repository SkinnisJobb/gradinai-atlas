# The OpenShift base (TASK-1485, ARO 3.1; design: docs/oss/research/openshift-aro.md). Always-on
# objects only: what every install runs whatever components it adds. deploy/openshift/README.md
# describes the layout, what each later task adds, and what an overlay must change.
#
# Not deployable on its own: the database Secrets (atlas-db-app, atlas-db-ca) come from the
# CloudNativePG Cluster of the `cnpg` component (task 3.5), the peppers from
# scripts/openshift/new-secrets.py or the External Secrets Operator, and the public host from the
# overlay.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# On every object and pod template, never in a selector (a selector cannot change after create).
# `version` is the release the base's image and migrate Job name belong to; an overlay that moves
# the image moves all three together (README, "Releases").
labels:
  - pairs:
      app.kubernetes.io/part-of: atlas
      app.kubernetes.io/version: v0.0.3-alpha
    includeSelectors: false
    includeTemplates: true

resources:
  - serviceaccount.yaml
  - configmap-service-ca.yaml
  - service-api.yaml
  - deployment-api.yaml
  - pdb-api.yaml
  - job-migrate.yaml
  - cronjob-audit-purge.yaml
  - service-mcp.yaml
  - deployment-mcp.yaml
  - service-tls.yaml
  - deployment-tls.yaml
  - pdb-tls.yaml
  - route-atlas.yaml

configMapGenerator:
  # atlas-env keeps its plain name (no content hash). The migrate Job loads it, and a Job's pod
  # template cannot change under the same name: with a hash, any config change inside a release
  # would make `oc apply` of the Job fail. A config change therefore needs
  # `oc rollout restart deploy/atlas-api` (the deploy pipeline runs one after applying).
  - name: atlas-env
    envs:
      - atlas.env
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: config
  # The exec probe of atlas-api and atlas-mcp, a small standard-library script run with the
  # image's own Python, mounted at /run/config/scripts/ (https_probe.py says why it is not
  # httpGet). Hashed: a changed script rolls both Deployments.
  - name: atlas-scripts
    files:
      - https_probe.py
    options:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: config
  # atlas-tls's Caddy configuration (task 3.3), mounted at /etc/caddy/: the Caddyfile and the two
  # client-auth snippets it imports (CADDY_CLIENT_AUTH). Hashed: a changed Caddyfile rolls
  # atlas-tls. The files live in base/caddy/ because Kustomize reads a generator's files only from
  # inside the kustomization's own directory.
  - name: atlas-caddy
    files:
      - caddy/Caddyfile
      - caddy/client-auth-off.caddy
      - caddy/client-auth-require.caddy
    options:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: config
