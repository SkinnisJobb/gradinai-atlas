# atlas-mcp's Service (TASK-1489; research question 3). TLS only: uvicorn serves :8493 with the
# certificate the service CA issues for this Service because of the annotation, into the
# `kubernetes.io/tls` Secret atlas-mcp-tls (`tls.crt`, `tls.key`), for the names
# `atlas-mcp.<namespace>.svc` and its cluster-domain form. Only atlas-tls (task 3.3) reaches it,
# for `/mcp` on the public door, verifying that name against atlas-service-ca; the
# NetworkPolicies (task 3.4) admit nothing else. No plain-HTTP port exists (the image's :8092 CMD
# is replaced).
apiVersion: v1
kind: Service
metadata:
  name: atlas-mcp
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: mcp
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: atlas-mcp-tls
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: mcp
  ports:
    - name: https
      port: 8493
      targetPort: https
      protocol: TCP
