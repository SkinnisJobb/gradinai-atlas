# The identity of every Atlas pod (TASK-1485). Nothing in Atlas calls the Kubernetes API, so no
# Role is bound to it and no token is mounted: the field is false here and again on each pod spec
# (the pod's field wins over the ServiceAccount's, whichever account an overlay assigns).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas
  labels:
    app.kubernetes.io/name: atlas
automountServiceAccountToken: false
