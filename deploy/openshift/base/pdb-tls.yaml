# Keep one atlas-tls serving through a node drain (TASK-1490; research question 9), as pdb-api.yaml
# does for atlas-api. An overlay that runs one atlas-tls replica must delete this PDB (a
# minAvailable of 1 on one replica blocks every drain).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: atlas-tls
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: tls
spec:
  minAvailable: 1
  # A pod that is not Ready protects nothing: let a drain evict it rather than block on it.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/component: tls
