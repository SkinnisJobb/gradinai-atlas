# The schema step of a release (TASK-1485; research question 5): `atlas-migrate upgrade`, once per
# release, before the Deployments roll. It runs startup's schema steps and exits; it writes no row.
#
# ONE NAME PER RELEASE: atlas-migrate-<version>, the version in DNS-label form. A Job's pod
# template cannot change once created, so each release must be a new object: the old one keeps
# its log for the audit trail until ttlSecondsAfterFinished removes it, and `oc apply` never has
# to update a Job. The base names it for the release its image belongs to; an overlay that moves
# the image renames the Job in the same change (deploy/openshift/README.md, "Releases"). Forgetting
# to is loud, not silent: re-applying a changed pod template under an existing name fails.
#
# The pipeline applies it, waits with `oc wait --for=condition=complete job/<name>`, and only then
# rolls the Deployments. Starting atlas-api alongside it is also safe: the boot and this command
# take the same Postgres advisory lock (backend/main.py boot_lock), so one waits for the other.
#
# It loads atlas-env and gets the database URL (CloudNativePG's `fqdn-uri`, as atlas-api reads it),
# its CA and the peppers (importing the gate needs the peppers), and nothing else: it drops the
# sign-in settings itself (backend/migrate_cli.py), so no OIDC Secret is mounted. No probes: it
# serves nothing. Same security context as atlas-api.
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-migrate-v0-0-3-alpha
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: migrate
spec:
  # RETRIES. On a first install the Job, the Cluster and its app Secret are created at once, and
  # CloudNativePG writes the Secret before PostgreSQL accepts connections, so the first runs meet
  # `Connection refused`. Six retries, 10 s apart and doubling, wait out a database that comes up
  # within about five minutes; the deadline below still ends the Job at ten. The upgrade is
  # idempotent, so a retry after a real failure is harmless.
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: atlas
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas-migrate
          # The same image as atlas-api (deployment-api.yaml); one `images:` entry moves both.
          image: registry.example.com/gradinai-atlas/gradinai-atlas-api-ubi:v0.0.3-alpha@sha256:abfec73fe0e6d47a5fd7c4cee2c09184f43dafc86c48e3006715b3d859acbad8
          imagePullPolicy: IfNotPresent
          command: ["atlas-migrate", "upgrade"]
          envFrom:
            - configMapRef:
                name: atlas-env
          env:
            - name: ATLAS_DB_URL_FILE
              value: /run/secrets/db/fqdn-uri
            - name: ATLAS_PASSWORD_PEPPER_FILE
              value: /run/secrets/peppers/password_pepper
            - name: ATLAS_TOKEN_PEPPER_FILE
              value: /run/secrets/peppers/token_pepper
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /run/secrets/db-ca/ca.crt
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: peppers
              mountPath: /run/secrets/peppers
              readOnly: true
            - name: db
              mountPath: /run/secrets/db
              readOnly: true
            - name: db-ca
              mountPath: /run/secrets/db-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: peppers
          secret:
            secretName: atlas-peppers
            defaultMode: 0440
            items:
              - key: password_pepper
                path: password_pepper
              - key: token_pepper
                path: token_pepper
        - name: db
          secret:
            secretName: atlas-db-app
            defaultMode: 0440
            items:
              - key: fqdn-uri
                path: fqdn-uri
        - name: db-ca
          secret:
            secretName: atlas-db-ca
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
