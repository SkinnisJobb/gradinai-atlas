# OPTIONAL: a pull secret, for a registry that needs credentials (FIRST-INSTALL.md, step 7,
# choice b `mirror`; step 9 writes the same patch from the values sheet). Not applied until
# its line under `patches:` in kustomization.yaml is uncommented.
#
# `atlas-pull-secret` is a Secret of type kubernetes.io/dockerconfigjson in the project; create it
# first, or change the name in both places below to the one the platform team already put there.
#
# WHY ON THE SERVICEACCOUNTS. Every Atlas pod (the Deployments, the migrate Job, the audit
# CronJob) runs as ServiceAccount `atlas`, and Kubernetes copies a ServiceAccount's
# imagePullSecrets onto each pod that uses it. That is independent of the API token: the base's
# `automountServiceAccountToken: false` stays, and no token is mounted. Patching the
# ServiceAccount here keeps it declarative; `oc secrets link atlas atlas-pull-secret --for=pull`
# does the same by hand and survives `oc apply -k`, but it lives only in the cluster: a fresh
# install from the overlay would not have it.
#
# The database pods are not `atlas`'s: CloudNativePG runs them as a ServiceAccount of its own,
# named after the Cluster (`atlas-db`), and copies the Cluster's `spec.imagePullSecrets` onto it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas
imagePullSecrets:
  - name: atlas-pull-secret
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atlas-db
spec:
  imagePullSecrets:
    - name: atlas-pull-secret
