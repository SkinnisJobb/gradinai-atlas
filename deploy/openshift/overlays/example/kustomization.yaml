# The example overlay: a first install of Atlas on OpenShift (TASK-1496, ARO 3.7, first step).
# deploy/openshift/FIRST-INSTALL.md walks through using it, step by step, from PowerShell 7.
#
# WHAT IT IS. The smallest overlay that installs Atlas in one namespace on the working
# assumptions of the ARO epic: images pulled straight from ghcr.io, a community CloudNativePG
# Cluster on the default storage class with no backup, plain Secrets made by
# scripts/openshift/new-secrets.py, a re-encrypt Route on the router's default certificate,
# local accounts. No optional component yet, and the NetworkPolicies are one commented line in
# `components:` (switch it on when the project template already holds NetworkPolicies:
# FIRST-INSTALL.md, troubleshooting). The full template (task 3.7, second step) grows THIS
# directory, after task 3.6.
#
# FILL IN BEFORE `oc apply -k` (every value to change says `change-me`; FIRST-INSTALL.md step 5):
#   1. `namespace:` below                    your project
#   2. `change-me-owner` in `images:` below   the GitHub account that publishes the images
#   3. atlas.env                              the public host, in four lines (and the privacy text)
#   4. patch-trusted-proxy.yaml and           the cluster's pod network CIDR, in both (atlas-api
#      patch-tls-trusted-proxy.yaml           comma-separated, atlas-tls space-separated)
# The Route's host is copied from ATLAS_PUBLIC_HOST in atlas.env (`replacements:` below), so the
# host is typed in one file only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 1. The project (namespace) Atlas runs in. It must exist already: FIRST-INSTALL.md step 2.
namespace: change-me-namespace

resources:
  - ../../base

# The database: a CloudNativePG Cluster `atlas-db`, community API group (postgresql.cnpg.io),
# default storage class, 2 instances, NO backup. If the cluster runs EDB Postgres for Kubernetes
# instead, add ../../components/cnpg-edb after it. For backups, replace this line with
# ../../components/cnpg-objectstore-plugin (never both). deploy/openshift/README.md, "The database".
components:
  - ../../components/cnpg
  # NetworkPolicies: default deny for every Atlas pod, then one allow per edge. Needed at once if
  # the project came with NetworkPolicies of its own (the operator cannot reach the database
  # otherwise); set the operator's namespace if it is not cnpg-system (README, "NetworkPolicies").
  # - ../../components/networkpolicies

# 2. The images of release v0.0.1-alpha, by tag AND the digest the release published (its
# release-images.env). The base names a placeholder registry (registry.example.com), because the
# repository names no account; each entry below matches one base name and moves every container
# that uses it (atlas-api, its db-url init container, the migrate Job and the audit CronJob all
# run the api image).
#
# `change-me-owner` is the GitHub account the Atlas repository belongs to, in LOWER CASE
# (ghcr.io refuses capitals): github.com/<Owner>/gradinai-atlas gives ghcr.io/<owner>/....
# Mirroring to your own registry (ACR, Quay, an internal mirror) instead: copy the same digests
# there and change `newName` only; the digest guarantees the bytes are the same. The database
# image and a pull secret are the commented entries at the end of `patches:` (FIRST-INSTALL.md,
# "Your own registry").
#
# These are the Debian-based hardened images. The UBI builds (task 1.4) replace them in a later
# release: change newName, newTag and digest together, and the Job name and version label below.
images:
  - name: registry.example.com/gradinai-atlas/gradinai-atlas-api
    newName: ghcr.io/change-me-owner/gradinai-atlas-api
    newTag: v0.0.1-alpha
    digest: sha256:fe919e98baf5375eeee650e746d98d4a240e470da11f29b37f2690e548d8afb9
  - name: registry.example.com/gradinai-atlas/gradinai-atlas-mcp
    newName: ghcr.io/change-me-owner/gradinai-atlas-mcp
    newTag: v0.0.1-alpha
    digest: sha256:fa24d32824eb485b77c672e845fdcddc994aaf09dfde5c8304cc4a91272a905b
  - name: registry.example.com/gradinai-atlas/gradinai-atlas-tls
    newName: ghcr.io/change-me-owner/gradinai-atlas-tls
    newTag: v0.0.1-alpha
    digest: sha256:8902763650a5a117dda378a228e184a04df25a4dd03d0a43e0dd6ccfdc9f0cb5

# The release these images belong to; moves with them.
labels:
  - pairs:
      app.kubernetes.io/version: v0.0.1-alpha
    includeSelectors: false
    includeTemplates: true
  # LABELS YOUR ORGANISATION REQUIRES (optional; FIRST-INSTALL.md, step 6): some clusters refuse,
  # by an admission policy, any object or pod without certain labels. Uncomment and put the
  # platform team's keys and values in place of the two examples. includeSelectors: false keeps
  # them out of the selectors (a Deployment's selector cannot change after it is created);
  # includeTemplates puts them on the pods; `fields` also on the database pods, which
  # CloudNativePG labels from the Cluster's inheritedMetadata.
  # - pairs:
  #     example.com/environment: change-me-environment
  #     example.com/cost-center: change-me-cost-center
  #   includeSelectors: false
  #   includeTemplates: true
  #   fields:
  #     - {kind: Cluster, path: spec/inheritedMetadata/labels, create: true}

# 3. The settings that differ from the base's atlas-env: the public host and the seed. Merged
# over the base's keys; a key not listed here keeps the base's value (base/atlas.env).
configMapGenerator:
  - name: atlas-env
    behavior: merge
    envs:
      - atlas.env
    options:
      disableNameSuffixHash: true

patches:
  # 4. Whose client-address header atlas-api believes: the pod network (patch-trusted-proxy.yaml).
  - path: patch-trusted-proxy.yaml
    target:
      kind: Deployment
      name: atlas-api
  # 4b. Whose X-Forwarded-For atlas-tls (Caddy) believes: the same network
  # (patch-tls-trusted-proxy.yaml).
  - path: patch-tls-trusted-proxy.yaml
    target:
      kind: Deployment
      name: atlas-tls
  # The migrate Job is named per release (deploy/openshift/README.md, "Images and releases"). On
  # v0.0.1-alpha the base's name is already right, so this replaces it with itself; on the next
  # release change `value` to atlas-migrate-<version, dots as dashes> together with the images.
  - target:
      kind: Job
      name: atlas-migrate-v0-0-1-alpha
    patch: |-
      - op: replace
        path: /metadata/name
        value: atlas-migrate-v0-0-1-alpha
  # OWN REGISTRY (optional; FIRST-INSTALL.md, "Your own registry"), for a cluster that cannot pull
  # from ghcr.io. The three images above: change `newName` only, the digest stays. The database
  # image: uncomment the second entry and give it the mirrored name with the SAME tag and digest
  # as `imageName` in components/cnpg/cluster.yaml. A registry that needs credentials: uncomment
  # the first entry too (patch-pull-secret.yaml: imagePullSecrets on ServiceAccount `atlas` and
  # on Cluster `atlas-db`).
  # - path: patch-pull-secret.yaml
  # - target: {kind: Cluster, name: atlas-db}
  #   patch: |-
  #     - op: replace
  #       path: /spec/imageName
  #       value: <registry>/<path>/postgresql:<same tag>@sha256:<same digest>
  # OLDER CLOUDNATIVEPG (optional; FIRST-INSTALL.md, step 1, "The CloudNativePG version"): an
  # operator whose app Secret has no `fqdn-uri` key (before 1.25.3, or 1.26.0), or that has no
  # `Database` resource (before 1.25.0). Uncomment both entries: patch-older-cnpg.yaml switches
  # atlas-api and the audit CronJob to the `uri` key and drops the Database; the inline one does
  # the same for the migrate Job (by kind, so it holds whatever the Job is named).
  # - path: patch-older-cnpg.yaml
  # - target: {kind: Job}
  #   patch: |-
  #     apiVersion: batch/v1
  #     kind: Job
  #     metadata: {name: atlas-migrate}
  #     spec: {template: {spec: {volumes: [{name: db, secret: {items: [{key: uri, path: fqdn-uri}]}}]}}}

# The Route's host is ATLAS_PUBLIC_HOST, copied, so the two can never differ (a request whose
# Host is not ATLAS_PUBLIC_HOST is refused with 421). The base's Route `atlas` carries
# atlas.example.com; atlas-tls reads the same key from atlas-env as CADDY_PUBLIC_HOST.
replacements:
  - source:
      kind: ConfigMap
      name: atlas-env
      fieldPath: data.ATLAS_PUBLIC_HOST
    targets:
      - select:
          kind: Route
        fieldPaths:
          - spec.host
        options:
          create: true
