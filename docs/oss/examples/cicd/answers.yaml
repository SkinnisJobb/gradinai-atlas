# Example: the setup guide's CI/CD answers, for a first pipeline generated from them and the
# guardrails matrix (guardrails/dev-staging-prod.yaml). In atlas-api:
#   atlas-admin cicd generate --platform github --matrix dev-staging-prod.yaml \
#       --answers answers.yaml --out ./generated
# (--platform gitlab or azure for the other two). Review the files under ./generated and commit
# them. The keys and values are the setup guide's own, topic `cicd`.

# The guide's `cicd` topic.
cicd:
  # The checks the pipeline runs, one job each.
  checks: [build, unit_tests, lint, sast, secret_scan]
  # The checks that must pass before any deploy; the others may fail without stopping it.
  gates: [build, unit_tests, lint]
  # Production deploys on a merge to its branch, after a person approves.
  deploy_trigger: on_merge
# The guide's `environments` topic: only how changes move between environments is read here.
environments:
  # Each environment deploys after the one before it.
  promotion: sequential
