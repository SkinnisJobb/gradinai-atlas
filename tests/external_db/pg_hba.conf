# The install smoke's external PostgreSQL (tests/external_db/docker-compose.extdb.yml).
# The local socket, for the job's own setup through docker exec; TCP only over TLS with a
# password; plain TCP refused outright.
local   all   all                 trust
hostssl all   all   0.0.0.0/0     scram-sha-256
hostssl all   all   ::/0          scram-sha-256
host    all   all   0.0.0.0/0     reject
host    all   all   ::/0          reject
