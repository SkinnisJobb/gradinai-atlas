# The install smoke's SSO leg (STORY-oss-17 x STORY-oss-13): a THROWAWAY OpenID provider beside
# the OSS stack, and atlas-api pointed at it. Test-only. It is an overlay read by
# .github/workflows/install-smoke.yml after the shipped deploy/oss/docker-compose.yml, and it is
# never part of an install: deploy/oss/ does not reference it.
#
#   docker compose -f docker-compose.yml -f <arbitrary-uid.yml> -f ../../tests/sso/docker-compose.idp.yml ...
#
# WHY navikt/mock-oauth2-server (and not Dex or Keycloak). It runs the real authorization-code
# flow with PKCE (S256 is verified at the token endpoint), puts the authorization request's
# nonce in an RS256 ID token signed by a key it publishes at its JWKS, serves discovery, and
# serves all of it over HTTPS from a PKCS12 keystore we generate in the job. Its interactive
# login form takes a username and a JSON object of extra claims, so ONE container gives the
# smoke a person in the required group, one outside it, and the same person after leaving it,
# with no user directory to provision. Dex's static users carry no groups (its groups need an
# LDAP or upstream connector), and Keycloak is a ~500 MB image with a realm to import and a
# minute of start-up: more CI minutes for the same proof. What it does NOT do: it accepts any
# client secret (the client credential is sent, but only Atlas's side of it is exercised), and
# it does not check redirect_uri. The Atlas checks of a callback (state, PKCE, nonce, iss, aud,
# azp, alg, signature) are what this leg proves on the live stack; their negative cases are
# backend/verify_oidc_login.py's (stub IdP, no network).
#
# Everything under ${SMOKE_SSO_DIR} is generated by the job in $RUNNER_TEMP: the IdP's own
# throwaway CA (not the install CA: an enterprise IdP is signed by the enterprise's PKI, not by
# Atlas's) and its server keystore, the keystore password inside the IdP's config file, the
# client secret, and the group map. Nothing secret is in this file or in the repository.

services:
  atlas-idp:
    # navikt/mock-oauth2-server 6.1.0 (2026-10-16), pinned tag@digest (the multi-arch index).
    image: ghcr.io/navikt/mock-oauth2-server:6.1.0@sha256:ae4bacd3e5b08cd7ad12281e4524403290848a3358a29e4f7356c029b36ebe0b
    environment:
      # The port it listens on is the port it is published on, so the issuer it derives from
      # the Host header (https://idp.test:8446/atlas) is the same for atlas-api (on the `idp`
      # network) and for the runner's browser-shaped client (through the published port).
      SERVER_PORT: "8446"
      # A FILE: the keystore password is in it, never in an environment variable.
      JSON_CONFIG_PATH: /idp/config.json
    volumes:
      - type: bind
        source: ${SMOKE_SSO_DIR:?set SMOKE_SSO_DIR}/idp
        target: /idp
        read_only: true
    ports:
      # Loopback only: the runner's client is the one browser this IdP serves.
      - "127.0.0.1:8446:8446"
    networks:
      idp:
        aliases:
          - idp.test
      # Its published port. Only atlas-idp is on it.
      idp-edge: {}
    restart: "no"

  atlas-api:
    environment:
      # The CA that signed the IdP's certificate: httpx (identity/oidc.py) honours SSL_CERT_FILE,
      # so atlas-api verifies the IdP's TLS against exactly this file. atlas-api has no route out
      # in this layout, so no public CA is needed beside it.
      SSL_CERT_FILE: /run/secrets/idp_ca
    secrets:
      - db_url
      - password_pepper
      - token_pepper
      - oidc_client_secret
      - oidc_group_map
      - idp_ca
    networks:
      idp: {}

secrets:
  oidc_client_secret:
    file: ${SMOKE_SSO_DIR:?set SMOKE_SSO_DIR}/oidc_client_secret
  oidc_group_map:
    file: ${SMOKE_SSO_DIR:?set SMOKE_SSO_DIR}/oidc_group_map.yml
  idp_ca:
    file: ${SMOKE_SSO_DIR:?set SMOKE_SSO_DIR}/idp-ca.crt

networks:
  # atlas-api and atlas-idp only. No route out.
  idp:
    internal: true
  # atlas-idp's published port.
  idp-edge: {}
